name: release-please

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release-please:
    runs-on: ho-z10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag this job just created cannot start the Release workflow on its
      # own: GitHub does not raise a push event for a tag pushed with
      # GITHUB_TOKEN, which is why v0.1.0 was published with nothing to
      # download and nothing failed to say so. workflow_dispatch through the
      # API is the one trigger GITHUB_TOKEN is allowed to fire, so ask for the
      # build explicitly rather than hoping for a cascade.
      - name: Build the release
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
