name: release-please

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # The manifest is read below to find out which release should exist, so the
      # repository has to be here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The release pull request has to be authored by something other than
      # GITHUB_TOKEN or its checks never run. GitHub does create them, as
      # `action_required`, and holds them for a person to press a button: a
      # `pull_request` run started by GITHUB_TOKEN is deliberately gated so
      # automation cannot drive its own CI. An unapproved check suite publishes
      # no check runs at all, so the pull request shows an empty check list and
      # reads as merely slow rather than blocked. Three releases were approved
      # by hand before this was written down.
      #
      # Dispatching CI at the release branch does not fix it, and that was
      # measured rather than assumed. A `workflow_dispatch` run on the pull
      # request's own head branch does produce a check run on the head commit,
      # and GitHub does list the pull request in the run's `pull_requests`, but
      # the commit's status check rollup stays empty and `gh pr checks` answers
      # "no checks reported". GitHub documents the rule under "Checks from some
      # workflow jobs are not evaluated": only `push`, `pull_request`,
      # `pull_request_review`, `pull_request_target`, `deployment` and
      # `deployment_status` produce checks a pull request will show or a ruleset
      # will accept. So the workflow_dispatch call that gets the release built
      # cannot get the release pull request checked, and adding one here would
      # have looked like a fix while changing nothing.
      #
      # An App installation token is authored by the App, so the branch push and
      # the pull request trigger workflows the ordinary way. Without the
      # credentials this falls back to GITHUB_TOKEN and behaves as it always
      # has, which is why the secrets are optional rather than required.
      - name: Decide which token release-please gets
        id: creds
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app=false' >> "$GITHUB_OUTPUT"
            echo "::notice::No release App credentials; this pull request needs its checks approved by hand."
          fi

      # continue-on-error, because a rotated key or an uninstalled App should
      # cost the release its automatic checks and nothing else. Failing here
      # would take the whole release with it, and a release that does not happen
      # is worse than one that needs a button pressed.
      - name: Mint an App token
        id: app-token
        if: steps.creds.outputs.app == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The fallback is silent otherwise, and a silent fallback to the behaviour
      # this change exists to remove is how it would go unnoticed for months.
      - name: Say so if the App token could not be minted
        if: steps.creds.outputs.app == 'true' && steps.app-token.outputs.token == ''
        run: |
          echo "::warning::App credentials set but no token minted; used GITHUB_TOKEN, so checks need approving."

      # `token` is empty when the step above was skipped or failed, and an empty
      # string is falsy here, so the `||` resolves to GITHUB_TOKEN: exactly
      # today's behaviour.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A draft release does not create its tag: GitHub only writes the ref when
      # the release is published, and publishing is the last thing that happens
      # here, after the binaries are attached. So the tag is created explicitly,
      # because everything downstream needs something to check out and something
      # for `git describe` to find.
      #
      # The commit is the one release-please released from, read back from the
      # draft rather than assumed to be this push's head.
      - name: Create the tag for the draft release
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          # The releases list rather than the by-tag lookup, because
          # /releases/tags/{tag} answers 404 for a draft. The list returns drafts
          # to a token that may see them, and this one may.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  | jq -r --arg t "$TAG" 'map(select(.tag_name == $t)) | first | .target_commitish // empty')
          if [ -z "$sha" ]; then
            echo "no draft for $TAG names a commit to tag" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already tagged"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$sha" >/dev/null
          echo "tagged $TAG at $sha"

      # Deliberately still GITHUB_TOKEN, both here and in the tag step above,
      # even when an App token exists. A tag written by the App would raise a
      # push event, `release.yaml` listens for `v*`, and the release would then
      # be built twice: once by the push and once by the dispatch below, racing
      # each other to upload the same asset names into the same draft. The App
      # token exists to get the release pull request its checks, and nothing
      # else.
      #
      # The tag this job just created cannot start the Release workflow on its
      # own: GitHub does not raise a push event for a ref written with
      # GITHUB_TOKEN, which is why v0.1.0 was published with nothing to download
      # and nothing failed to say so. workflow_dispatch through the API is the
      # one trigger GITHUB_TOKEN is allowed to fire, so ask for the build
      # explicitly rather than hoping for a cascade.
      #
      # The release stays a draft until that build has uploaded to it. GoReleaser
      # publishes it as its own last step, so the release becomes "latest" and
      # gains its archives in one move: there is no moment when `install.sh`
      # resolves a release it cannot download from, which is what made v0.5.0
      # uninstallable for four minutes.
      - name: Build the release
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"

      # The steps above only run when release-please reports success. It can
      # create the release and then fail afterwards: v0.4.0 was tagged and
      # published, then the action died posting its comment to a locked pull
      # request, so the build was never asked for and the release sat with
      # nothing to download. Nothing was watching.
      #
      # So do not trust the output, ask GitHub what the release the manifest
      # names actually looks like. It is asked for by tag and not by "latest",
      # because a draft is exactly what the latest-release endpoint hides, which
      # is the point of drafting it: the old version of this step looked up the
      # latest release and would now find the previous one, see its assets, and
      # report everything fine while the new release sat unbuilt.
      #
      # A draft is either seconds old and waiting for the build the step above
      # asked for, or it is the failure described here. Both want the same
      # dispatch, and a duplicate is harmless: GoReleaser uploads into the same
      # draft. The job still reports the original failure, which is the signal
      # that something needs a look.
      - name: Finish any release left unbuilt
        if: always() && !steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v$version"

          # The releases list rather than the by-tag lookup: /releases/tags/{tag}
          # answers 404 for a draft, which is exactly the release this step is
          # looking for.
          all=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  | jq -c --arg t "$tag" '[.[] | select(.tag_name == $t)]')
          if [ "$(jq 'length' <<<"$all")" = "0" ]; then
            echo "no release exists for $tag yet"
            exit 0
          fi

          # A published release for this tag ends it, whatever else carries the
          # same tag. More than one release can: a dispatched build uploads into
          # a draft and then fails to publish it, because GitHub refuses a
          # second release owning one tag. Taking the first match rather than
          # asking whether any is published turned that into a loop, where every
          # push read a leftover draft as an unbuilt release and asked for
          # another build that left another draft.
          published=$(jq -c '[.[] | select(.draft == false)] | first // empty' <<<"$all")
          if [ -n "$published" ]; then
            echo "$tag is published with $(jq '.assets | length' <<<"$published") assets"
            exit 0
          fi

          # Only drafts remain. Prefer one that already carries assets, so a
          # retry finishes the build that got furthest rather than starting over.
          state=$(jq -c 'sort_by(.assets | length) | reverse | first' <<<"$all")
          assets=$(jq '.assets | length' <<<"$state")
          if [ "$(jq 'length' <<<"$all")" -gt 1 ]; then
            echo "warning: $tag has $(jq 'length' <<<"$all") releases and none is published" >&2
          fi

          # A build already in flight will publish this draft on its own, and a
          # second dispatch for the same tag would race it to the same asset
          # names.
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yaml \
                   --limit 20 --json status \
                   -q '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$busy" != "0" ]; then
            echo "$tag is a draft with $assets assets and $busy release runs are in flight"
            exit 0
          fi

          # The tag step above may be what died, and a draft carries no ref, so
          # there would be nothing for the build to check out.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            sha=$(jq -r '.target_commitish // empty' <<<"$state")
            if [ -z "$sha" ]; then
              echo "$tag is an untagged draft naming no commit; it needs a person" >&2
              exit 1
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
            echo "tagged $tag at $sha"
          fi

          echo "$tag is an unpublished draft with $assets assets; asking for the build"
          gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$tag"
