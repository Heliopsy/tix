name: release-please

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release-please:
    runs-on: ho-z10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag this workflow just created cannot start the Release workflow by
  # itself, because a tag pushed with GITHUB_TOKEN does not raise a push event
  # for other workflows. Calling it is the way to build the artifacts without
  # handing out a personal access token.
  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
