name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions: read-all

# Every job below invokes a `just` recipe rather than inlining commands, so
# `just ci` locally and this workflow cannot drift apart.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tix
          POSTGRES_PASSWORD: tix
          POSTGRES_DB: tix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TIX_TEST_POSTGRES_DSN: postgres://tix:tix@127.0.0.1:5432/tix?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Verify go.sum is tidy
        run: just tidy-check

      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test ./... -race -shuffle=on -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: just cover-check

      # The runner carries an SSH client and pseudo-terminals, so the whole
      # suite runs here rather than announcing a skipped capability.
      - name: Smoke the built binary
        run: just smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Build CI toolbox image
        run: just image-ci
        env:
          CONTAINER_ENGINE: docker

      - name: golangci-lint
        run: just lint
        env:
          CONTAINER_ENGINE: docker

      - name: actionlint
        run: just actionlint
        env:
          CONTAINER_ENGINE: docker

      - name: hadolint
        run: just hadolint
        env:
          CONTAINER_ENGINE: docker

      - name: yamllint
        run: just yamllint
        env:
          CONTAINER_ENGINE: docker

      - name: markdownlint
        run: just mdlint
        env:
          CONTAINER_ENGINE: docker

  spec:
    name: Specs & Docs
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.13.1

      - name: Validate specs
        run: openspec validate tix-v1 --strict
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Docs index is complete
        run: just docs-check

  sast:
    name: SAST (gosec)
    runs-on: ho-z10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose=text ./...

      # Code scanning is unavailable on a private repository without Advanced
      # Security, so the upload is skipped until the repo is public. gosec
      # itself still runs above and still fails the job on findings.
      - name: Upload SARIF to GitHub Security tab
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: gosec.sarif

  sca:
    name: SCA (govulncheck + trivy)
    runs-on: ho-z10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Build CI toolbox image
        run: just image-ci
        env:
          CONTAINER_ENGINE: docker

      - name: Run govulncheck
        run: just vuln
        env:
          CONTAINER_ENGINE: docker

      # Trivy runs from our own pinned toolbox image rather than the upstream
      # action, so there is exactly one trivy version in the project and CI
      # cannot disagree with `just trivy`.
      - name: Run Trivy (filesystem scan)
        if: always()
        run: just trivy
        env:
          CONTAINER_ENGINE: docker

      - name: Trivy SARIF
        if: always()
        run: just trivy-sarif
        env:
          CONTAINER_ENGINE: docker

      - name: Upload Trivy SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: trivy.sarif

  crosscompile:
    name: Cross-compile (CGO_ENABLED=0)
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Proves no cgo dependency has crept in and broken the release matrix.
      - name: Build all targets
        run: just build-all
