name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions: read-all

# Every job below invokes a `just` recipe rather than inlining commands, so
# `just ci` locally and this workflow cannot drift apart.

jobs:
  # Everything below this job runs on ho-z10, a self-hosted runner, which means
  # a pull request from a fork would build and test someone else's code on our
  # own hardware. Fork pull requests already need a maintainer to approve the
  # run, but approval is a person clicking a button, and it should not be the
  # only thing between a stranger's code and the machine.
  #
  # So a fork gets this job instead, on a throwaway GitHub runner. Every step
  # in Build & Test uses the Go toolchain alone, so the whole of it runs here
  # unchanged, against both engines: a contributor gets real signal on whether
  # their change works, not a token green tick.
  #
  # What a fork does not get is the container-backed gates -- golangci-lint,
  # gosec, govulncheck, trivy, the spec and docs checks -- because those run
  # from a pinned toolbox image that takes minutes to build and exists to keep
  # one version of each tool in the project. Rebuilding it per pull request to
  # avoid one runner is the wrong trade. Those run on push, so an external
  # change is fully scanned once it lands on a branch here. The job name says
  # which suite this is, so a green tick on a fork is not mistaken for the
  # whole of CI.
  fork-pr:
    name: Build & Test (fork PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tix
          POSTGRES_PASSWORD: tix
          POSTGRES_DB: tix
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIX_TEST_POSTGRES_DSN: postgres://tix:tix@127.0.0.1:5432/tix?sslmode=disable
    steps:
      # Same reason as Build & Test: the skill staleness guard needs history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Verify go.sum is tidy
        run: just tidy-check

      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test ./... -race -shuffle=on -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: just cover-check

      - name: Smoke the built binary
        run: just smoke

  build-and-test:
    name: Build & Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
    env:
      TIX_TEST_POSTGRES_DSN: postgres://tix:tix@127.0.0.1:5432/tix?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The skill staleness guard locates a recorded commit with
          # merge-base, which a depth-1 checkout cannot answer. Without the
          # full history it skips, announcing itself, and the check that is
          # meant to catch a stale marker never runs at all.
          fetch-depth: 0

      # This was a `services:` container. The self-hosted runner has no Docker
      # daemon, so the cluster shipped in the runner image is started in-job
      # instead; the job's ephemeral pod is the same isolation boundary the
      # service container was.
      #
      # Version note: the runner image carries Postgres 16, the service
      # container used 18. Credentials, database and port are unchanged, so
      # TIX_TEST_POSTGRES_DSN above still matches.
      - name: Start Postgres
        run: |
          sudo pg_ctlcluster 16 main start
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -q && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432
          sudo -u postgres psql -c "CREATE USER tix WITH PASSWORD 'tix' SUPERUSER;"
          sudo -u postgres createdb -O tix tix
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Verify go.sum is tidy
        run: just tidy-check

      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test ./... -race -shuffle=on -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: just cover-check

      # The runner carries an SSH client and pseudo-terminals, so the whole
      # suite runs here rather than announcing a skipped capability.
      - name: Smoke the built binary
        run: just smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: golangci-lint
        run: just lint

      - name: actionlint
        run: just actionlint

      - name: hadolint
        run: just hadolint

      - name: yamllint
        run: just yamllint

      - name: markdownlint
        run: just mdlint

  spec:
    name: Specs & Docs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.13.1

      - name: Validate specs
        run: openspec validate tix-v1 --strict
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Docs index is complete
        run: just docs-check

  sast:
    name: SAST (gosec)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose=text ./...

      # Code scanning is unavailable on a private repository without Advanced
      # Security, so the upload is skipped until the repo is public. gosec
      # itself still runs above and still fails the job on findings.
      - name: Upload SARIF to GitHub Security tab
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: gosec.sarif

  sca:
    name: SCA (govulncheck + trivy)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
      security-events: write
    steps:
      # fetch-depth: 0 because `just secrets` reads the whole history. It refuses
      # to run on a shallow clone rather than scanning one commit and passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Run govulncheck
        run: just vuln

      # This runner has no container engine, so `just tool` falls back to
      # PATH, and gitleaks is not installed there the way trivy is. Install the
      # version Containerfile.ci pins rather than a second one written here:
      # two places naming a tool version is how the local gate and this one
      # start disagreeing without anybody noticing.
      - name: Install gitleaks
        if: always()
        run: |
          version=$(sed -n 's/^ARG GITLEAKS_VERSION=//p' Containerfile.ci)
          if [ -z "$version" ]; then
            echo "no GITLEAKS_VERSION in Containerfile.ci; the scan would run an unpinned build" >&2
            exit 1
          fi
          go install "github.com/zricethezav/gitleaks/v8@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan the history for secrets
        if: always()
        run: just secrets

      # Trivy runs from our own pinned toolbox image rather than the upstream
      # action, so there is exactly one trivy version in the project and CI
      # cannot disagree with `just trivy`.
      - name: Run Trivy (filesystem scan)
        if: always()
        run: just trivy

      - name: Trivy SARIF
        if: always()
        run: just trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: trivy.sarif

  crosscompile:
    name: Cross-compile (CGO_ENABLED=0)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Proves no cgo dependency has crept in and broken the release matrix.
      - name: Build all targets
        run: just build-all
