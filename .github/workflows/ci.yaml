name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Nightly, so the full macOS suite runs on main even through a quiet week of
  # pull requests that only ran its quick half.
  schedule:
    - cron: '23 2 * * *'

permissions: read-all

# A new push to a pull request makes the run for the previous one worthless,
# so that run is cancelled. Pushes to main are never cancelled: each one is
# the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below invokes a `just` recipe rather than inlining commands, so
# `just ci` locally and this workflow cannot drift apart.
#
# Go caches: every job restores through .github/actions/go and saves at its end
# only on a push to main. A pull request reads main's cache and writes none.
# Test results are never taken from it: every go test here runs with -count=1.

jobs:
  # The checks that need no test run, so a formatting slip or a broken build
  # fails in a couple of minutes instead of after the suite. It also smokes
  # the built binary, which needs a build and nothing else.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: go
        uses: ./.github/actions/go
        with:
          job: gate
      # just-version, because without it the action passes an empty version
      # specifier to setup-crate, which then lists casey/just releases and
      # picks the newest. That lookup failed once mid-run with "no release for
      # just matching version specifier", while 1.59.0 sat there published and
      # not a prerelease, so it was the resolution that blinked rather than
      # upstream. Every other job in the same run installed just fine.
      #
      # This repository pins every action to a commit for reproducibility and
      # then let the tool one of them installs float, which is the same hole a
      # layer down. An exact tag is one deterministic request instead of a
      # list-and-match, and a bump is a one-line change somebody reviews.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0

      - name: Verify go.sum is tidy
        run: just tidy-check

      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Build
        run: go build ./...

      # Every package in exactly one shard, and every shard in the matrix below.
      - name: Test shards cover every package
        run: just shards-check

      - name: Release files match the newest release
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          just release-files-check "${{ github.head_ref }}"

      # The runner carries an SSH client and pseudo-terminals, so the whole
      # suite runs here rather than announcing a skipped capability.
      - name: Smoke the built binary
        run: just smoke

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The suite, split by package across runners. scripts/test-shards.sh owns
  # the split and `just shards-check` fails if a package lands in no shard or
  # two, or if this matrix stops naming one. Every shard runs under the race
  # detector, shuffled, with coverage, and against PostgreSQL as well as
  # SQLite: the service container is cheap and keeps each shard's environment
  # the one the single job used to have.
  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [service, cmd, web, api, store, rest]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tix
          POSTGRES_PASSWORD: tix
          POSTGRES_DB: tix
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIX_TEST_POSTGRES_DSN: postgres://tix:tix@127.0.0.1:5432/tix?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The skill staleness guard locates a recorded commit with
          # merge-base, which a depth-1 checkout cannot answer. Without the
          # full history it skips, announcing itself, and the check that is
          # meant to catch a stale marker never runs at all.
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          job: test-${{ matrix.shard }}
      # Pinned for the reason given in the gate job: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0

      - name: Test with coverage
        run: just test-shard ${{ matrix.shard }}

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            out/coverage/${{ matrix.shard }}.out
            out/coverage/${{ matrix.shard }}.env.log
          retention-days: 5
          if-no-files-found: error

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The 85% floor applies to the whole suite, so it is checked once over the
  # merged shards. It runs whenever the matrix finished, and fails rather than
  # skips when a shard failed: a skipped required check reads as a pass.
  coverage:
    name: Coverage
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          [ "$RESULT" = success ] || { echo "the test matrix ended in $RESULT"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/go
        with:
          job: coverage
      # Pinned for the reason given in the gate job.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          path: out/coverage
          merge-multiple: true

      - name: Merge the shard profiles
        run: just cover-merge

      - name: Check coverage threshold
        run: just cover-floor

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  # macOS is a published target: every release carries darwin amd64 and arm64,
  # and until now nothing had ever run them. crosscompile proves the darwin
  # binaries link, which is not the same claim: a path separator, a /proc read
  # or a Linux-only syscall compiles on any host and fails on the one it runs
  # on. This executes the suite where the binary is actually shipped to run.
  #
  # The whole suite on main, nightly, and on a pull request that touches
  # anything the operating system can tell apart (`just os-scope` decides).
  # Other pull requests run the rest and store shards, where every package
  # that reaches the operating system lives, and leave the four heavy
  # database-logic packages to Linux.
  #
  # No postgres. Service containers are a Linux-runner feature, so this job
  # exercises the SQLite path alone; the suite notices the missing capability
  # and announces it rather than passing quietly. The postgres engine is
  # covered by the test matrix, which is also where the coverage floor is
  # enforced, so neither is duplicated here.
  #
  # macos-15 rather than macos-latest: the label moves when GitHub promotes a
  # new image, and a runner changing under the project is how a green suite
  # starts failing on a morning nobody pushed anything.
  macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          job: macos
      # Pinned for the reason given in the gate job: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0

      # On a pull request HEAD is the merge commit and HEAD^1 its base.
      - name: Decide how much of the suite to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "scope=$(just os-scope HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: just vet

      - name: Test
        if: steps.scope.outputs.scope == 'full'
        run: just test

      - name: Test the packages that reach the operating system
        if: steps.scope.outputs.scope != 'full'
        run: |
          just test-shard rest
          just test-shard store

      # The runner has an SSH client and pseudo-terminals, as the Linux one
      # does, so the terminal interface is exercised here too rather than
      # being the one surface nobody checks on a Mac.
      - name: Smoke the built binary
        run: just smoke

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # Layout regressions used to merge because the only thing that looked for
  # them, `just screenshots --strict`, ran on a laptop when somebody
  # remembered. This runs it on every change, against a seed written to break
  # layouts, plus the tests that drive a real browser and the JavaScript suite.
  # `just ui-regression` is the same gate locally.
  ui-regression:
    name: UI regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TIX_TOOL_MODE: direct
      TIX_UI_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 its base, which
          # is all the artifact step below needs to see what the change touched.
          fetch-depth: 2
      - id: go
        uses: ./.github/actions/go
        with:
          job: ui-regression
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Playwright
        id: playwright
        working-directory: scripts/screenshots
        run: |
          npm ci --no-audit --no-fund
          echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps so the download is cached even
      # when the checks below fail; the combined action only saves on success.
      - name: Restore the Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: scripts/screenshots
        run: npx playwright install chromium
      - name: Save the Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system libraries and fonts Chromium draws with, every run: they live
      # outside the cache, and a missing font changes every line break.
      - name: Install Chromium's libraries and fonts
        working-directory: scripts/screenshots
        run: npx playwright install-deps chromium

      # `just ui-regression` runs these four steps in this order. They are
      # separate here so one failing still lets the others report.
      - name: Page check on every route
        run: just ui-check

      - name: Task rows and cards
        if: success() || failure()
        run: just ui-rows --jobs "$TIX_UI_JOBS"

      - name: Browser tests
        if: success() || failure()
        run: just ui-browser

      - name: JavaScript tests
        if: success() || failure()
        run: just jstest

      - name: Did the change touch the web interface
        id: touched
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(internal/web/|scripts/screenshots/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload screenshots and contact sheet
        if: failure() || steps.touched.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-regression-screenshots
          path: |
            out/ui-regression/
            out/screenshots/
          retention-days: ${{ job.status == 'success' && 5 || 14 }}
          if-no-files-found: ignore

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: go
        uses: ./.github/actions/go
        with:
          job: lint
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: golangci-lint actionlint hadolint yamllint markdownlint

      - name: golangci-lint
        run: just lint

      - name: actionlint
        run: just actionlint

      - name: shellcheck
        run: just shellcheck

      - name: stream filter guard
        run: just streamtest

      - name: scene syntax
        run: just scenecheck

      - name: hadolint
        run: just hadolint

      - name: yamllint
        run: just yamllint

      - name: markdownlint
        run: just mdlint

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  spec:
    name: Specs & Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: openspec

      # `just spec`, not a hardcoded change name. This step read
      # `openspec validate tix-v1 --strict` until tix-v1 was archived, at which
      # point CI failed with "Unknown item 'tix-v1'" while `just ci` passed,
      # because the recipe walks the directory and the step named one change.
      # AGENTS.md and the project plan both say every CI job invokes a just
      # recipe so the two cannot diverge; this step was the exception.
      - name: Validate specs
        run: just spec
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Docs index is complete
        run: just docs-check

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: go
        uses: ./.github/actions/go
        with:
          job: sast

      - uses: ./.github/actions/toolbox
        with:
          tools: gosec

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose=text ./...

      # Code scanning is unavailable on a private repository without Advanced
      # Security, so the upload is skipped until the repo is public. gosec
      # itself still runs above and still fails the job on findings.
      - name: Upload SARIF to GitHub Security tab
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: gosec.sarif

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  sca:
    name: SCA (govulncheck + trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      # fetch-depth: 0 because `just secrets` reads the whole history. It refuses
      # to run on a shallow clone rather than scanning one commit and passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          job: sca

      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: govulncheck gitleaks trivy

      - name: Run govulncheck
        run: just vuln

      - name: Scan the history for secrets
        if: always()
        run: just secrets

      # Trivy runs from our own pinned toolbox image rather than the upstream
      # action, so there is exactly one trivy version in the project and CI
      # cannot disagree with `just trivy`.
      - name: Run Trivy (filesystem scan)
        if: always()
        run: just trivy

      - name: Trivy SARIF
        if: always()
        run: just trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: trivy.sarif

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The image was never a CI gate, so the one this project shipped instructions
  # for bound its server to loopback inside its own network namespace: it built,
  # it started, and it reset every connection. A build that succeeds proves
  # nothing, so this job runs the container and asks it for things.
  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # The manifest list is assembled from local storage, which needs podman:
      # `docker manifest create` resolves its arguments in a registry and cannot
      # see a locally built image. The runner has both.
      CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The image stamps its version with `git describe`, and the gate asserts
          # the stamp it gets back from /healthz is this build's.
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          job: image
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: trivy

      # Builds both published architectures, runs the native one and asks it for
      # /healthz, /readyz, the web UI and its assets, checks the server's uid, and
      # proves a database on /data outlives the container. Then trivy against the
      # layers rather than the source tree.
      - name: Build, run and scan the image
        run: just image-gate

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  crosscompile:
    name: Cross-compile (CGO_ENABLED=0)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: go
        uses: ./.github/actions/go
        with:
          job: crosscompile
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: goreleaser

      # Proves no cgo dependency has crept in and broken the release matrix.
      - name: Build all targets
        run: just build-all

      - name: Save the Go cache
        if: >-
          always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}
