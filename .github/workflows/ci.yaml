name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions: read-all

# Every job below invokes a `just` recipe rather than inlining commands, so
# `just ci` locally and this workflow cannot drift apart.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tix
          POSTGRES_PASSWORD: tix
          POSTGRES_DB: tix
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIX_TEST_POSTGRES_DSN: postgres://tix:tix@127.0.0.1:5432/tix?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The skill staleness guard locates a recorded commit with
          # merge-base, which a depth-1 checkout cannot answer. Without the
          # full history it skips, announcing itself, and the check that is
          # meant to catch a stale marker never runs at all.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # just-version, because without it the action passes an empty version
      # specifier to setup-crate, which then lists casey/just releases and
      # picks the newest. That lookup failed once mid-run with "no release for
      # just matching version specifier", while 1.59.0 sat there published and
      # not a prerelease, so it was the resolution that blinked rather than
      # upstream. Every other job in the same run installed just fine.
      #
      # This repository pins every action to a commit for reproducibility and
      # then let the tool one of them installs float, which is the same hole a
      # layer down. An exact tag is one deterministic request instead of a
      # list-and-match, and a bump is a one-line change somebody reviews.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0

      - name: Verify go.sum is tidy
        run: just tidy-check

      - name: Check formatting
        run: just fmt-check

      - name: Vet
        run: just vet

      - name: Build
        run: go build ./...

      # -timeout 40m, the same as `just cover`. This step inlined the command
      # without it, so the justfile gaining the flag did nothing here: a
      # coverage run carries an atomic counter on every block, and under load
      # internal/service passes go test's 10 minute default and reports a panic
      # that says nothing about the code. The step is inlined rather than
      # calling `just cover` because that recipe also writes an HTML report and
      # an env summary this job does not want; the flag is what has to match.
      - name: Test with coverage
        run: go test ./... -race -shuffle=on -timeout 40m -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: just cover-check

      # The runner carries an SSH client and pseudo-terminals, so the whole
      # suite runs here rather than announcing a skipped capability.
      - name: Smoke the built binary
        run: just smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  # macOS is a published target: every release carries darwin amd64 and arm64,
  # and until now nothing had ever run them. crosscompile proves the darwin
  # binaries link, which is not the same claim: a path separator, a /proc read
  # or a Linux-only syscall compiles on any host and fails on the one it runs
  # on. This executes the suite where the binary is actually shipped to run.
  #
  # No postgres. Service containers are a Linux-runner feature, so this job
  # exercises the SQLite path alone; the suite notices the missing capability
  # and announces it rather than passing quietly. The postgres engine is
  # covered by Build & Test, which is also where the coverage floor is
  # enforced, so neither is duplicated here.
  #
  # macos-15 rather than macos-latest: the label moves when GitHub promotes a
  # new image, and a runner changing under the project is how a green suite
  # starts failing on a morning nobody pushed anything.
  macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -shuffle=on -timeout 40m

      # The runner has an SSH client and pseudo-terminals, as the Linux one
      # does, so the terminal interface is exercised here too rather than
      # being the one surface nobody checks on a Mac.
      - name: Smoke the built binary
        run: just smoke

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: golangci-lint actionlint hadolint yamllint markdownlint

      - name: golangci-lint
        run: just lint

      - name: actionlint
        run: just actionlint

      - name: shellcheck
        run: just shellcheck

      - name: stream filter guard
        run: just streamtest

      - name: scene syntax
        run: just scenecheck

      - name: hadolint
        run: just hadolint

      - name: yamllint
        run: just yamllint

      - name: markdownlint
        run: just mdlint

  spec:
    name: Specs & Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: openspec

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.13.1

      # `just spec`, not a hardcoded change name. This step read
      # `openspec validate tix-v1 --strict` until tix-v1 was archived, at which
      # point CI failed with "Unknown item 'tix-v1'" while `just ci` passed,
      # because the recipe walks the directory and the step named one change.
      # AGENTS.md and the project plan both say every CI job invokes a just
      # recipe so the two cannot diverge; this step was the exception.
      - name: Validate specs
        run: just spec
        env:
          OPENSPEC_TELEMETRY: "0"

      - name: Docs index is complete
        run: just docs-check

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/toolbox
        with:
          tools: gosec

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose=text ./...

      # Code scanning is unavailable on a private repository without Advanced
      # Security, so the upload is skipped until the repo is public. gosec
      # itself still runs above and still fails the job on findings.
      - name: Upload SARIF to GitHub Security tab
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: gosec.sarif

  sca:
    name: SCA (govulncheck + trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      # fetch-depth: 0 because `just secrets` reads the whole history. It refuses
      # to run on a shallow clone rather than scanning one commit and passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: govulncheck gitleaks trivy

      - name: Run govulncheck
        run: just vuln

      - name: Scan the history for secrets
        if: always()
        run: just secrets

      # Trivy runs from our own pinned toolbox image rather than the upstream
      # action, so there is exactly one trivy version in the project and CI
      # cannot disagree with `just trivy`.
      - name: Run Trivy (filesystem scan)
        if: always()
        run: just trivy

      - name: Trivy SARIF
        if: always()
        run: just trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy.sarif

  # The image was never a CI gate, so the one this project shipped instructions
  # for bound its server to loopback inside its own network namespace: it built,
  # it started, and it reset every connection. A build that succeeds proves
  # nothing, so this job runs the container and asks it for things.
  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # The manifest list is assembled from local storage, which needs podman:
      # `docker manifest create` resolves its arguments in a registry and cannot
      # see a locally built image. The runner has both.
      CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The image stamps its version with `git describe`, and the gate asserts
          # the stamp it gets back from /healthz is this build's.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: trivy

      # Builds both published architectures, runs the native one and asks it for
      # /healthz, /readyz, the web UI and its assets, checks the server's uid, and
      # proves a database on /data outlives the container. Then trivy against the
      # layers rather than the source tree.
      - name: Build, run and scan the image
        run: just image-gate

  crosscompile:
    name: Cross-compile (CGO_ENABLED=0)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned for the reason given in ci.yaml: an unset version makes the
      # action resolve "latest" on every run, and that resolution can blink.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: 1.59.0
      - uses: ./.github/actions/toolbox
        with:
          tools: goreleaser

      # Proves no cgo dependency has crept in and broken the release matrix.
      - name: Build all targets
        run: just build-all
