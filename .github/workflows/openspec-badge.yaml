name: OpenSpec Badge

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  badge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The badge action fails on a project with no published specs, which is
      # the state until the first change is archived.
      - id: specs
        run: |
          if [ -n "$(find openspec/specs -name '*.md' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No published specs yet; skipping badge generation."
          fi

      - if: steps.specs.outputs.present == 'true'
        uses: weAretechnative/openspec-badge-action@0ee70666841d4c08d3ec8a95b5546b91abc6125c  # main
        with:
          metric_types: number_of_specs,number_of_requirements,tasks_status,open_changes
