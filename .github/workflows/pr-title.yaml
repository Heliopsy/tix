name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: read-all

jobs:
  conventional:
    name: Conventional commit title
    runs-on: ho-z10
    permissions:
      pull-requests: read
    steps:
      # release-please derives the version bump from commit types, so a
      # non-conventional squash-merge title would silently break versioning.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
