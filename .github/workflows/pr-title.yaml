name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: read-all

jobs:
  conventional:
    name: Conventional commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # release-please derives the version bump from commit types, so a
      # non-conventional squash-merge title would silently break versioning.
      - uses: amannn/action-semantic-pull-request@7f33ba792281b034f64e96e4ff4fb8ed1940de1a  # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
