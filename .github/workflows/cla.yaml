name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: read-all

jobs:
  cla:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This check is advisory today: the repository carries no branch
      # protection and no rulesets, so a red `cla` does not stop a merge. That
      # is why it went unnoticed that the signature store did not exist at all
      # and no contributor could have signed. Requiring it is a repository
      # settings change and deliberately not made here.
      #
      # The release PR is opened by our own automation against our own
      # repository, so there is no contributor and nothing to sign. It is
      # excluded because this action locks a pull request once it merges, and
      # release-please posts its completion comment to that pull request
      # immediately afterwards: the lock landed 8 seconds after the merge and
      # the comment 4 seconds after that, so every release since v0.4.0 has
      # ended with the action reporting failure and nothing watching the
      # release it had already created. The lock is kept for real
      # contributions, where it is what stops a signature comment being
      # revoked after the fact.
      - name: CLA assistant
        if: >-
          github.head_ref != 'release-please--branches--main' &&
          (github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/heliopsy/tix/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The allowlist rather than another `if:` on the author, because the
          # action matches these against the login of every commit author on
          # the pull request, which nobody can change by renaming a branch.
          # The head_ref condition above can be dodged exactly that way, and
          # it is kept only because an allowlist entry cannot replace it: the
          # merge-time lock runs before the allowlist is ever consulted, so
          # the release pull request has to be excluded by condition or not at
          # all.
          #
          # Neither bot can sign a CLA, and a dependency bump carries no
          # copyright to assign. github-actions[bot] is also dropped by the
          # action itself, which filters its user id by hand, but only when
          # the commit resolves to that account: a commit whose author is not
          # linked to a user arrives with no id and is kept, and then only the
          # name matches. So it is named here too.
          allowlist: 'thereisnotime,dependabot[bot],github-actions[bot]'
