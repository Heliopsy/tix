name: Release

# A tag pushed by hand still builds. The tag release-please creates does not
# reach here on its own: it is written with GITHUB_TOKEN, and GitHub deliberately
# does not let a workflow's own token start another workflow, so v0.1.0 was
# published with no binaries attached and nothing failed to say so.
#
# The release-please workflow asks for the build with a workflow_dispatch API
# call, which is the one trigger GITHUB_TOKEN may fire. Dispatching by hand also
# rebuilds a tag that already exists, which is how v0.1.0 got its artifacts after
# the fact.
#
# release-please now creates the release as a draft, so this workflow is what
# makes it public: GoReleaser uploads into the draft and undrafts it as its own
# last step. Until this runs, `install.sh` and `tix update` resolve the previous
# release, which still has its archives, rather than a new one that has none.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to build.
        required: true
        type: string
      # The archives and the image fail independently, and rebuilding the
      # archives to fix the image is not free: `replace_existing_draft` is off,
      # so a second upload of the same assets is refused, and the only way
      # through would be deleting a release people can already download. v0.7.0
      # published its archives, pushed and signed its image, and then failed to
      # attest it, which is exactly this case.
      image_only:
        description: Rebuild and re-attest the container image, leaving a published release alone.
        required: false
        default: false
        type: boolean

permissions: read-all

jobs:
  goreleaser:
    if: ${{ !inputs.image_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Empty on a tag push, where the event already checks out the tag.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # GoReleaser, and the cosign and syft it runs to sign and inventory the
      # archives, come from the toolbox at the versions Containerfile.ci pins.
      # They used to come from goreleaser-action, cosign-installer and
      # download-syft, each fetching from github.com/OWNER/REPO/releases with
      # its own few retries, and v0.47.0 failed on a 504 from syft's. cosign
      # and syft now go through .github/actions/fetch-release-asset.sh, checked
      # against a pinned sha256 and cached. GoReleaser is built by go install
      # from the module proxy, checked by the checksum database, as the
      # cross-compile job already does, and is no longer whatever `~> v2`
      # resolved to on the day.
      #
      # The action comes from this workflow's own commit, as in the image job
      # below, and .ci-actions is removed before GoReleaser runs: it refuses a
      # dirty tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/toolbox
        with:
          tools: cosign goreleaser syft
      - name: Drop the workflow's own actions
        run: rm -rf .ci-actions

      # `use_existing_draft` makes GoReleaser look for the draft release-please
      # left, and it looks at drafts only: it does not find a published release
      # for the tag, so it tries to create one and GitHub refuses with a bare 422
      # already_exists. That is the path this workflow documents for rebuilding a
      # tag whose assets need replacing, which is how v0.1.0 got its artifacts
      # after the fact, so it has to keep working.
      #
      # Unpublishing costs something: for the length of the build the release is
      # not what the latest-release lookup resolves, and `install.sh` falls back
      # to the previous release. That is the same trade as everywhere else here,
      # and it is the only way the upload reaches the release it is meant for
      # rather than a second one beside it.
      - name: Hold an already-published release as a draft while it rebuilds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          tag="${REF:-${GITHUB_REF_NAME}}"
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                    | jq -c --arg t "$tag" 'map(select(.tag_name == $t)) | first // empty')
          if [ -z "$state" ]; then
            echo "$tag has no release yet; GoReleaser will create one"
            exit 0
          fi
          if [ "$(jq -r '.draft' <<<"$state")" = "true" ]; then
            echo "$tag is already a draft"
            exit 0
          fi
          id=$(jq -r '.id' <<<"$state")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true >/dev/null
          echo "$tag was published; held as a draft for this rebuild"

      # Signing is not retried. GoReleaser has no retry for `signs`, and cosign
      # has no flag for one: it retries a failed Rekor or Fulcio request inside
      # the one process, where a repeat of a request that did land is answered
      # 409 and cosign takes the existing entry. A second cosign process cannot
      # do that. Keyless signing makes a fresh key and certificate each time, so
      # a 500 that Rekor returned after committing the entry would leave it
      # behind beside the new one. Nothing is lost by stopping instead: the
      # checksums are signed before anything is uploaded, so a failure here
      # leaves the draft untouched and a fresh dispatch of the tag starts clean.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

  # The image is built, proven and scanned again here rather than trusted from
  # CI, then pushed. It runs after the release so a registry that is refusing
  # pushes cannot hold back the archives, which is the failure people actually
  # feel.
  image:
    name: Container image
    needs: goreleaser
    # Skipped is the goreleaser job declining to run under image_only, which is
    # the one case where a missing release build is not a reason to stop.
    if: >-
      ${{ always() && (needs.goreleaser.result == 'success' ||
      (needs.goreleaser.result == 'skipped' && inputs.image_only)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign, and the provenance attestation below, both need an OIDC
      # token from the runner.
      id-token: write
      attestations: write
    env:
      # The image recipes assemble a manifest list from local storage, which
      # needs podman: `docker manifest create` resolves its arguments in a
      # registry and cannot see a locally built image.
      CONTAINER_ENGINE: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The image stamps its version from `git describe`, which needs the tag
          # and the history behind it.
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned, cached and checksummed: .github/actions/just and
      # .github/actions/toolbox say why. Both are taken from this workflow's own
      # commit rather than the tag being built, because a dispatch that rebuilds
      # an older tag checks out a tree from before those actions existed, or
      # before they retried. The toolbox reads its pins from that commit too.
      # Removed once the tools are on PATH, so the image build sees only the
      # tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.ci-actions/.github/actions/just
      - uses: ./.ci-actions/.github/actions/toolbox
        with:
          tools: cosign syft trivy
      - name: Drop the workflow's own actions
        run: rm -rf .ci-actions

      - name: Resolve the tag and the repository to push to
        id: names
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          tag="${REF:-${GITHUB_REF_NAME}}"
          # A registry reference must be lowercase, and an owner name need not be.
          repo=$(printf '%s' "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # The image tags drop the leading v: `just image-tags` publishes
          # 0.7.0, 0.7 and latest, never v0.7.0. Anything addressing the
          # registry has to use this, and only the git ref uses the tag. v0.7.0
          # attested nothing because that distinction was missed here, and the
          # failure surfaced as a bare "manifest unknown" three steps later.
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"

      # Both architectures, the running container, and trivy against the layers.
      # The same recipe a developer runs, so this cannot drift from `just ci`.
      - name: Build, run and scan the image
        run: just image-gate

      # docker/login-action rather than `podman login`, because three tools here
      # need these credentials and they do not read the same file. cosign and the
      # provenance attestation read ~/.docker/config.json, which is what this
      # writes and what `podman login` does not: it writes
      # $XDG_RUNTIME_DIR/containers/auth.json, so the push would succeed and the
      # signature would fail as unauthorized. podman falls back to the docker
      # config when it finds no containers auth file, so one login serves all
      # three.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the manifest list
        id: push
        env:
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set -euo pipefail
          just image-push "$REPO" "$TAG"
          echo "digest=$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"

      # --recursive so the signature covers the two architecture manifests as
      # well as the list. Somebody who pulls on arm64 gets the child, and a
      # signature over the list alone is not one they can check against what
      # they are running.
      #
      # Not retried, for the reason given at the GoReleaser step, and one more:
      # --recursive signs three manifests in turn, so a pass that failed on the
      # last would, run again, put a second signature on the two it had
      # already signed. The same goes for the attestations below. Recovery is a
      # dispatch with image_only, started by someone who has looked at what the
      # registry holds.
      - name: Sign the image
        env:
          REF: ${{ steps.names.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes --recursive "$REF"

      # One SBOM per architecture, attested to that architecture's own digest. A
      # single SBOM attached to the list would describe one of the two images and
      # be signed as though it described both.
      - name: Attest an SBOM for each architecture
        env:
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          # The digests are read back from the registry, not from the local
          # list. podman re-encodes manifests on push, so a child's local digest
          # is not necessarily the one the registry stored, and attesting the
          # local one asks cosign to sign a manifest that is not there. v0.6.0
          # failed exactly that way: the list pushed as 4040d2b4 while the
          # attestation addressed a child digest the registry answered 404 for.
          for arch in amd64 arm64; do
            digest=$(podman manifest inspect "$REPO:$TAG" \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "the pushed manifest list carries no $arch entry to attest" >&2
              exit 1
            fi
            # There is deliberately no existence check on the child here. The
            # obvious one, `podman manifest inspect "$REPO@$digest"`, refuses
            # every correct digest: it reads manifest LISTS, and a child is a
            # plain image manifest, so it failed v0.7.0 twice while the
            # registry held exactly what was asked for. It would also be
            # tautological, because the digest is read out of the registry's
            # own list on the line above.
            podman save --format docker-archive -o "image-$arch.tar" "localhost/tix:latest-$arch"
            syft "docker-archive:image-$arch.tar" -o spdx-json > "sbom-$arch.spdx.json"
            cosign attest --yes --type spdxjson \
              --predicate "sbom-$arch.spdx.json" "$REPO@$digest"
            rm -f "image-$arch.tar"
          done

      # SLSA build provenance, which the release archives do not have: it records
      # this workflow, this commit and this runner as what produced the digest,
      # so a signature can be checked against where the bytes came from rather
      # than only against who signed them.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Ask the registry what it ended up holding, rather than trusting the
      # steps that put it there. v0.6.0 published an image that was signed and
      # carried no attestation, because the attest step addressed a digest the
      # registry did not have: every step before it reported success and the
      # release was only found wanting when somebody went looking. This is the
      # same lesson the empty-release guard already learned, so it is checked
      # the same way, against what is published.
      #
      # The tag is resolved fresh here instead of reusing the pushed digest,
      # because a reader pulls a tag and this must fail if the tag points
      # somewhere unsigned.
      - name: Verify what was published
        env:
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.names.outputs.version }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}
        run: |
          set -euo pipefail
          # Verifying only reads, from the registry, Rekor and the TUF root, so
          # unlike signing it is safe to repeat, and a 500 from one of them is
          # not a reason to call a published release broken.
          retry() {
            local i
            for i in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [ "$i" -lt 3 ]; then
                echo "attempt $i of 3 failed: $1 $2; next in $((i * 20))s" >&2
                sleep $((i * 20))
              fi
            done
            return 1
          }

          retry cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REPO:$TAG" >/dev/null
          echo "signature verified for $REPO:$TAG"

          for arch in amd64 arm64; do
            child=$(podman manifest inspect "$REPO:$TAG" \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            retry cosign verify-attestation --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REPO@$child" >/dev/null
            echo "sbom attestation verified for $arch at $child"
          done
