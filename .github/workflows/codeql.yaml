name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze Go
    # CodeQL requires code scanning, which a private repository does not have
    # without Advanced Security. Activates automatically when the repo is public.
    if: github.event.repository.visibility == 'public'
    # Not ho-z10. A pull request can start this, it checks the pull request's
    # own code out, and CodeQL then builds it. On a public repository that is a
    # stranger's code compiling on our hardware. GitHub's runners are free for
    # public repositories and are thrown away afterwards, which is what this
    # job wants anyway.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: go
      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
