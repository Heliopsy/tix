version: 2
project_name: tix
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    # android/arm64 is here for Termux, where the linux binary will not run:
    # Android's linker and its lack of a standard glibc make it a distinct
    # target, and the pure-Go sqlite driver builds for it because nothing here
    # uses cgo.
    goos: [linux, darwin, windows, android]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 is emulators only, and nobody runs a task tracker there.
      - goos: android
        goarch: amd64
    ldflags:
      - -s -w
      - -X github.com/heliopsy/tix/internal/version.Version={{.Version}}
      - -X github.com/heliopsy/tix/internal/version.Commit={{.Commit}}
      - -X github.com/heliopsy/tix/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --bundle=${artifact}.bundle
      - ${artifact}
      - --yes
    signature: ${artifact}.bundle
    artifacts: checksum

sboms:
  - artifacts: archive

changelog:
  use: github
  format: "{{.SHA}}: {{.Message}} (@{{.AuthorUsername}})"
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:']

release:
  footer: |
    **Full changelog**: See [CHANGELOG.md](https://github.com/heliopsy/tix/blob/main/CHANGELOG.md)
