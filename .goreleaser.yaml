version: 2
project_name: tix
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    # android/arm64 is published for Termux, though the claim that used to be
    # here, that the linux binary will not run there, is wrong: a
    # CGO_ENABLED=0 linux/arm64 binary runs on Android fine, and that is what
    # install.sh actually delivers, because Termux answers "Linux" to
    # `uname -s`. This target stays for anyone who wants the native GOOS, and
    # it builds because nothing here uses cgo.
    goos: [linux, darwin, windows, android]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 is emulators only, and nobody runs a task tracker there.
      - goos: android
        goarch: amd64
    ldflags:
      - -s -w
      - -X github.com/heliopsy/tix/internal/version.Version={{.Version}}
      - -X github.com/heliopsy/tix/internal/version.Commit={{.Commit}}
      - -X github.com/heliopsy/tix/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --bundle=${artifact}.bundle
      - ${artifact}
      - --yes
    signature: ${artifact}.bundle
    artifacts: checksum

sboms:
  - artifacts: archive

changelog:
  use: github
  format: "{{.SHA}}: {{.Message}} (@{{.AuthorUsername}})"
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:']

release:
  # GoReleaser always holds a release as a draft while it uploads and undrafts it
  # at the end, so `draft` stays false here: setting it true would stop that
  # final publish and leave every release invisible.
  #
  # use_existing_draft is what makes that sequence reach release-please's
  # release. release-please now creates a draft, and the endpoint GoReleaser
  # normally looks a release up by, /releases/tags/{tag}, does not return drafts:
  # without this GoReleaser would create a SECOND release for the same tag,
  # upload into it, and leave release-please's draft empty forever. With it,
  # findDraftRelease matches the draft by release name, which is "v0.5.0" from
  # release-please and "{{.Tag}}" here, so they agree.
  #
  # replace_existing_draft is deliberately left off: it deletes the draft it
  # finds, which would throw away the notes release-please wrote.
  use_existing_draft: true
  # Stated rather than relied on, because this is the moment the release becomes
  # the one `curl install.sh` and `tix update` resolve.
  make_latest: "true"
  footer: |
    **Full changelog**: See [CHANGELOG.md](https://github.com/heliopsy/tix/blob/main/CHANGELOG.md)
