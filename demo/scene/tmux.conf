#
# tmux for the recording. The status bar is off: by default it draws the
# session name, the window list, the hostname and a clock across the bottom of
# the pane, which is both a distraction and the only thing in the frame that
# names the machine and the date.
set -g status off

# Each pane says what it is. Three terminals stacked with no labels is three
# terminals; labelled, it is two agents and a board, which is the point.
set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#39414d'
set -g pane-active-border-style 'fg=#2dd4bf'
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*:Tc'
set -g mouse off
