            - workflow:write
      summary: Create or replace the workflow the path names
      tags:
        - workflow
  /healthz:
    get:
      description: 'Liveness: the process is up and names its version.'
      operationId: server.health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBody'
          description: HealthBody reports that the process is alive.
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "504":
          $ref: '#/components/responses/Error504'
      security: []
      summary: 'Liveness: the process is up and names its version'
      tags:
        - server
  /readyz:
    get:
      description: 'Readiness: the database answers and its migrations are current.
        503 when a check fails, with the same body.'
      operationId: server.ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyBody'
          description: ReadyBody reports whether the server can serve traffic.
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyBody'
          description: ReadyBody reports whether the server can serve traffic.
        "504":
          $ref: '#/components/responses/Error504'
      security: []
      summary: 'Readiness: the database answers and its migrations are current'
      tags:
        - server
components:
  responses:
    Error400:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Bad Request: `invalid`.'
    Error401:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Unauthorized: `unauthenticated`.'
    Error403:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Forbidden: `forbidden`.'
    Error404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Not Found: `not_found`, `no_task_available`.'
    Error409:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Conflict: `conflict`, `lease_expired`.'
    Error413:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Request Entity Too Large: `invalid`, the body was refused before
        it was read.'
    Error415:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Unsupported Media Type: `invalid`, the body was refused before
        it was read.'
    Error422:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Unprocessable Entity: `precondition_failed`.'
    Error500:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Internal Server Error: `internal`.'
    Error502:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Bad Gateway: `upstream`.'
    Error504:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Gateway Timeout: `internal`, the request ran past the server''s
        timeout.'
  schemas:
    APIToken:
      description: APIToken is a scoped bearer credential, normally held by an agent.
      properties:
        actor_id:
          description: ActorID is the actor the token acts as.
          type: string
        created_at:
          description: CreatedAt is when the token was issued, RFC 3339.
          format: date-time
          type: string
        expires_at:
          description: ExpiresAt is when the token stops authenticating, RFC 3339.
            Absent means it never expires.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the token's identifier, used to list and revoke it. It
            is not the secret.
          type: string
        last_used_at:
          description: LastUsedAt is when the token last authenticated a request,
            RFC 3339. Absent if never used.
          format: date-time
          type:
            - "null"
            - string
        name:
          description: Name is the label given to the token when it was created.
          type: string
        project_id:
          description: ProjectID restricts the token to one project when set. Empty
            means every project the actor can reach.
          type: string
        revoked_at:
          description: RevokedAt is when the token was revoked, RFC 3339. A revoked
            token never authenticates again.
          format: date-time
          type:
            - "null"
            - string
        scopes:
          description: Scopes are the permissions the token carries; a request outside
            them is refused.
          items:
            $ref: '#/components/schemas/Scope'
          type:
            - array
            - "null"
        tenant_id:
          description: TenantID is the tenant the token authenticates to.
          type: string
      type: object
    AcceptInviteInput:
      description: AcceptInviteInput accepts an invite.
      properties:
        display_name:
          description: DisplayName replaces the account's display name when set; ignored
            for an existing account.
          type: string
        password:
          description: Password is the new password, at least 12 characters, or for
            an existing account its current password.
          type: string
        surface:
          $ref: '#/components/schemas/Surface'
          description: Surface is the sign-in path the session is for, which decides
            whether a second factor is required; omitted means the command line.
      type: object
    Actor:
      description: Actor is the authenticated identity performing an operation.
      properties:
        display_name:
          description: DisplayName is the human-readable name, when one is set.
          type: string
        global_admin:
          description: GlobalAdmin reports, on the answer to WhoAmI, that the actor
            may act as a global admin right now. It is a report for interfaces deciding
            what to offer; authorization never reads it, and asks the store instead.
          type: boolean
        handle:
          description: Handle is the actor's short unique name within the tenant.
          type: string
        id:
          description: ID is the actor's stable identifier.
          type: string
        kind:
          $ref: '#/components/schemas/ActorKind'
          description: Kind says whether the actor is a user, an agent or the system.
        project_id:
          description: ProjectID restricts the actor to one project when set, as a
            project-scoped token does.
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the human's role in the tenant, whose scopes add to
            Scopes.
        scopes:
          description: Scopes are the scopes granted directly, as an API token's are;
            empty when authority comes from Role alone.
          items:
            $ref: '#/components/schemas/Scope'
          type: array
        tenant_id:
          description: TenantID is the tenant the actor acts in.
          type: string
        token_id:
          description: TokenID is the API token the request authenticated with, if
            any.
          type: string
      type: object
    ActorKind:
      description: ActorKind distinguishes the sort of worker an Actor represents.
      enum:
        - user
        - agent
        - system
      type: string
    AddDomainInput:
      description: AddDomainInput maps a hostname to the current tenant.
      properties:
        cert_mode:
          description: CertMode describes how a domain obtains its TLS certificate.
          type: string
        cert_path:
          description: CertPath is the server-side path of the PEM certificate, required
            when CertMode is "file".
          type: string
        hostname:
          description: Hostname is the host requests for this tenant arrive on. It
            is lowercased and any port or trailing dot is dropped. Required.
          type: string
        key_path:
          description: KeyPath is the server-side path of the PEM private key, required
            when CertMode is "file".
          type: string
      type: object
    AddMemberRequest:
      description: AddMemberRequest grants an actor a role in the resolved tenant.
      properties:
        actor_id:
          description: ActorID is the actor to grant the role to.
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the role to grant, which decides the member's scopes.
      type: object
    Artifact:
      description: Artifact is structured output attached to a task by a worker.
      properties:
        actor_id:
          description: ActorID is the actor that wrote the artifact, normally the
            claim holder.
          type: string
        blob:
          description: Blob is inline content, base64 in JSON, at most 1 MiB. Larger
            content belongs elsewhere, referenced from Payload.
          format: base64
          type: string
        content_type:
          description: ContentType is the media type of Blob, such as "text/plain".
          type: string
        created_at:
          description: CreatedAt is when the artifact was written, RFC 3339.
          format: date-time
          type: string
        id:
          description: ID is the artifact's unique identifier.
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
          description: Kind classifies the output.
        name:
          description: Name labels the artifact among the task's others.
          type: string
        payload:
          additionalProperties: {}
          description: Payload is structured output as a JSON object.
          type: object
        task_id:
          description: TaskID is the ID of the task the artifact is attached to.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the artifact.
          type: string
      type: object
    ArtifactInput:
      description: ArtifactInput records structured output on a task. An artifact
        is the holder's work product, so a task carrying a live lease requires its
        token.
      properties:
        blob:
          description: Blob is inline content, base64 in JSON, at most 1 MiB; larger
            content belongs elsewhere, referenced from Payload.
          format: base64
          type: string
        content_type:
          description: ContentType is the media type of Blob.
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
          description: Kind classifies the output. Required.
        lease_token:
          description: LeaseToken is the claim's token, required while the task is
            claimed.
          type: string
        name:
          description: Name labels the artifact among the task's others.
          type: string
        payload:
          additionalProperties: {}
          description: Payload is structured output as a JSON object.
          type: object
      type: object
    ArtifactKind:
      description: ArtifactKind classifies a worker's structured output.
      enum:
        - result
        - log
        - file
        - metric
      type: string
    AuditEntry:
      description: AuditEntry is one append-only record of a change.
      properties:
        action:
          description: Action names the change, such as "task.create".
          type: string
        actor_id:
          description: ActorID is the actor who made the change. Empty for a system
            change.
          type: string
        after:
          description: After is the record as JSON after the change. Absent for a
            removal.
        before:
          description: Before is the record as JSON before the change. Absent for
            a creation.
        occurred_at:
          description: OccurredAt is when the change was made, RFC 3339.
          format: date-time
          type: string
        seq:
          description: Seq is the entry's position in the tenant's audit log, increasing.
          format: int64
          type: integer
        source:
          $ref: '#/components/schemas/Source'
          description: Source is the surface the change came through.
        subject_id:
          description: SubjectID is the ID of the record changed.
          type: string
        subject_type:
          description: SubjectType is the kind of record changed, such as "task".
          type: string
        tenant_id:
          description: TenantID is the tenant the entry belongs to.
          type: string
        via:
          $ref: '#/components/schemas/Via'
          description: Via is the access channel the change arrived through and what
            identified the caller on it. Kind is unknown on an entry recorded before
            channels were.
      type: object
    BulkAction:
      description: BulkAction names what a bulk task request does to each task it
        names.
      enum:
        - move
        - priority
        - tag_add
        - tag_remove
        - assign
        - star
        - unstar
        - copy
        - delete
        - restore
      type: string
    BulkOutcome:
      description: BulkOutcome is what a bulk action did to one task.
      properties:
        applied:
          description: Applied reports whether the action landed on the task.
          type: boolean
        code:
          description: Code is the error kind of a refusal, such as not_found or conflict.
          type: string
        copy_ref:
          description: CopyRef names the new task a copy created.
          type: string
        error:
          description: Error is the refusal's message.
          type: string
        ref:
          description: Ref is the task reference as given.
          type: string
      type: object
    BulkResult:
      description: BulkResult reports a bulk action, one outcome per distinct reference
        in the order they were given.
      properties:
        action:
          $ref: '#/components/schemas/BulkAction'
          description: Action is the action applied.
        applied:
          description: Applied counts the tasks the action landed on.
          type: integer
        outcomes:
          description: Outcomes holds one entry per distinct reference, in the order
            given.
          items:
            $ref: '#/components/schemas/BulkOutcome'
          type:
            - array
            - "null"
        refused:
          description: Refused counts the tasks it was refused for.
          type: integer
      type: object
    BulkTaskInput:
      description: 'BulkTaskInput is one action applied to many tasks. Only the argument
        the action needs is read: To for a move, Priority for priority, Tag for the
        tag actions, AssigneeActorID for assign (empty clears), ProjectRef for a copy
        and Cascade for a delete.'
      properties:
        action:
          $ref: '#/components/schemas/BulkAction'
          description: Action is what to do to each task.
        assignee_actor_id:
          description: AssigneeActorID is the actor to assign; empty clears the assignee.
          type: string
        cascade:
          description: Cascade lets a delete take a task's subtasks with it.
          type: boolean
        priority:
          description: Priority orders tasks in a queue.
          type: integer
        project_ref:
          description: ProjectRef is the project a copy goes to, by key or id.
          type: string
        refs:
          description: 'Refs are the tasks to act on, by reference such as OPS-12
            or by id: 1 to 500, repeats folded.'
          items:
            type: string
          type:
            - array
            - "null"
        tag:
          description: Tag is the tag name to add or remove.
          type: string
        to:
          description: To is the status a move walks each task to, by its workflow's
            shortest route.
          type: string
      type: object
    BundleExportInput:
      description: BundleExportInput selects what a bundle carries.
      properties:
        kinds:
          description: Kinds restricts the export. Empty exports every kind the selectors
            reach.
          items:
            $ref: '#/components/schemas/ComponentKind'
          type: array
        name:
          description: Name labels the bundle for the people who receive it.
          type: string
        project_refs:
          description: ProjectRefs selects projects by key or identifier, exported
            as project templates.
          items:
            type: string
          type: array
        webhook_ids:
          description: WebhookIDs selects individual webhook endpoints by identifier.
            Secrets never travel in a bundle.
          items:
            type: string
          type: array
        workflow_keys:
          description: WorkflowKeys selects individual workflows by key.
          items:
            type: string
          type: array
      type: object
    BundleResult:
      description: BundleResult reports an import, or what a preview would have done.
      properties:
        bundle_name:
          description: BundleName is the name the bundle was exported under, if any.
          type: string
        bundle_version:
          description: BundleVersion is the bundle format version that was read.
          type: integer
        outcomes:
          description: Outcomes lists what happened to each component, in bundle order.
          items:
            $ref: '#/components/schemas/ComponentOutcome'
          type:
            - array
            - "null"
        preview:
          description: Preview is true when nothing was written.
          type: boolean
        warnings:
          description: Warnings lists things the import noticed but did not refuse.
          items:
            type: string
          type: array
      type: object
    CalendarFeed:
      description: 'CalendarFeed is one actor''s subscribable feed of due dates. The
        secret that addresses it is never part of it: only IssuedCalendarFeed carries
        that, and only on the call that minted it.'
      properties:
        actor_id:
          description: ActorID is the feed's owner, whose access it reads with.
          type: string
        created_at:
          description: CreatedAt is when this secret was issued, RFC 3339.
          format: date-time
          type: string
        filter:
          description: Filter is the task filter expression the feed selects with.
            Empty means the tasks assigned to the owner that are not finished.
          type: string
        id:
          description: ID identifies the feed.
          type: string
        revoked_at:
          description: RevokedAt is when the feed stopped answering, RFC 3339, absent
            while it is live.
          format: date-time
          type:
            - "null"
            - string
        tenant_id:
          description: TenantID identifies the tenant the feed reads.
          type: string
      type: object
    CalendarFeedInput:
      description: CalendarFeedInput sets a feed's filter.
      properties:
        filter:
          description: Filter is a task filter expression of at most 1000 characters.
            Empty selects the caller's assigned tasks that are not finished.
          type: string
      type: object
    ChannelDelivery:
      description: 'ChannelDelivery is one attempt queue entry for a channel: an inbox
        item, or a test when ItemID is empty.'
      properties:
        attempts:
          description: Attempts counts the attempts made so far.
          type: integer
        channel_id:
          description: ChannelID identifies the channel the delivery goes to.
          type: string
        created_at:
          description: CreatedAt is when the delivery was queued, RFC 3339.
          format: date-time
          type: string
        id:
          description: ID identifies the delivery, for redelivering it.
          type: string
        item_id:
          description: ItemID identifies the inbox item delivered, empty for a test
            message.
          type: string
        last_error:
          description: LastError is the error of the most recent failed attempt.
          type: string
        last_status_code:
          description: LastStatusCode is the HTTP status the most recent attempt received.
          type: integer
        next_attempt_at:
          description: NextAttemptAt is when the next attempt is due, RFC 3339.
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
          description: Status is pending, delivered or failed.
      type: object
    ChannelFormat:
      description: ChannelFormat names how a personal channel's messages are shaped.
      enum:
        - generic
        - slack
        - discord
        - ntfy
      type: string
    Check:
      description: Check is one readiness probe and its outcome.
      properties:
        error:
          description: Error says why the probe failed, set only when it did.
          type: string
        name:
          description: Name is the probe, "database" or "migrations".
          type: string
        ok:
          description: OK is true when the probe passed.
          type: boolean
      type: object
    CheckItemInput:
      description: CheckItemInput ticks or clears one checklist item. Item counts
        from one in reading order; Version, when set, must be the task's current version.
      properties:
        done:
          description: Done ticks the item when true and clears it when false.
          type: boolean
        item:
          description: Item is the checklist item to change, counted from 1 in reading
            order.
          type: integer
        version:
          description: Version is the task version the change was based on; a stale
            one is a conflict, and omitted skips the check.
          type: integer
      type: object
    Checklist:
      description: Checklist is how many of a description's checklist items are ticked.
      properties:
        done:
          description: Done counts the ticked items.
          type: integer
        total:
          description: Total counts every item.
          type: integer
      type: object
    Claim:
      description: Claim is the result of successfully claiming a task.
      properties:
        lease:
          $ref: '#/components/schemas/LeaseGrant'
          description: Lease is how long the lease granted runs and which level decided
            it.
        lease_expires_at:
          description: LeaseExpiresAt is when the claim runs out unless renewed, RFC
            3339.
          format: date-time
          type: string
        lease_token:
          description: LeaseToken proves the claim. Renewing, releasing and writing
            artifacts need it; keep it secret.
          type: string
        task:
          $ref: '#/components/schemas/Task'
          description: Task is the claimed task as it stands after the claim.
      type: object
    ClaimInput:
      description: ClaimInput claims one task.
      properties:
        actor_id:
          description: ActorID claims on behalf of another actor, by identifier or
            handle; empty claims for the caller.
          type: string
        ttl:
          description: TTL is how long the lease holds, a duration such as "30m".
            Omitted takes the task, project, workflow or tenant default; a value above
            the maximum is refused.
          type: string
      type: object
    ClaimNextInput:
      description: ClaimNextInput claims the next eligible task.
      properties:
        actor_id:
          description: ActorID claims on behalf of another actor, by identifier or
            handle; empty claims for the caller.
          type: string
        project_refs:
          description: ProjectRefs restricts the queue to these projects, by key or
            identifier; empty means every project the caller may claim in.
          items:
            type: string
          type: array
        statuses:
          description: Statuses restricts the queue to tasks in any of these statuses;
            empty means every status that is not terminal.
          items:
            type: string
          type: array
        tags:
          description: Tags restricts the queue to tasks carrying any of these tags.
          items:
            type: string
          type: array
        ttl:
          description: TTL is how long the lease holds, a duration such as "30m".
            Omitted takes the configured default; a value above the maximum is refused.
          type: string
      type: object
    Comment:
      description: Comment is a message on a task.
      properties:
        author_actor_id:
          description: AuthorActorID is the actor who wrote the comment.
          type: string
        body:
          description: Body is the comment text, in Markdown.
          type: string
        created_at:
          description: CreatedAt is when the comment was written, RFC 3339.
          format: date-time
          type: string
        deleted_at:
          description: DeletedAt is when the comment was deleted, RFC 3339. Absent
            on a live comment.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the comment's unique identifier.
          type: string
        task_id:
          description: TaskID is the ID of the task commented on.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the comment.
          type: string
        updated_at:
          description: UpdatedAt is when the comment was last edited, RFC 3339.
          format: date-time
          type: string
      type: object
    CommentRequest:
      description: CommentRequest carries a comment body.
      properties:
        body:
          description: Body is the comment text, Markdown.
          type: string
      type: object
    ComponentAction:
      description: ComponentAction names what an import did, or would do, to one component.
      enum:
        - created
        - updated
        - renamed
        - skipped
      type: string
    ComponentKind:
      description: ComponentKind names a kind of reusable component a bundle can carry.
      enum:
        - workflow
        - field_def
        - tag
        - project_template
        - webhook
      type: string
    ComponentOutcome:
      description: ComponentOutcome reports what happened to one component.
      properties:
        action:
          $ref: '#/components/schemas/ComponentAction'
          description: Action is what the import did, or would do, to the component.
        key:
          description: Key is the component's key as the bundle carries it.
          type: string
        kind:
          $ref: '#/components/schemas/ComponentKind'
          description: Kind is the kind of component.
        new_key:
          description: NewKey is set when the component was renamed to avoid a collision.
          type: string
        reason:
          description: Reason explains a rename or a skip.
          type: string
      type: object
    Connection:
      description: 'Connection is one connection a server process is holding right
        now. Nothing about it is stored: it is true only while the process runs.'
      properties:
        actor_handle:
          description: ActorHandle is that actor's handle.
          type: string
        actor_id:
          description: ActorID is the actor the connection authenticated as.
          type: string
        fingerprint:
          description: Fingerprint names the key an SSH connection opened with, and
            is empty on every other surface.
          type: string
        id:
          description: ID identifies the connection within the answering server, for
            ending it.
          type: string
        remote:
          description: Remote is the client address the connection came from, without
            its port.
          type: string
        since:
          description: Since is when the connection opened, RFC 3339.
          format: date-time
          type: string
        surface:
          $ref: '#/components/schemas/ConnectionSurface'
          description: Surface is the access path the connection arrived on.
        tenant_id:
          description: TenantID identifies the tenant the connection reads.
          type: string
      type: object
    ConnectionCounts:
      description: 'ConnectionCounts reports how many connections are live. The per-surface
        figures and Tenant cover the caller''s own tenant. Process covers every connection
        the server holds and deliberately carries no breakdown by tenant, actor or
        address: it is capacity information, not a directory.'
      properties:
        events:
          description: Events counts the tenant's live event stream connections.
          type: integer
        process:
          description: Process counts every connection this server holds, across all
            tenants.
          type: integer
        ssh:
          description: SSH counts the tenant's live SSH connections.
          type: integer
        tenant:
          description: Tenant counts all of the tenant's live connections.
          type: integer
      type: object
    ConnectionList:
      description: ConnectionList is one server's answer about what it is holding.
        ServerID names the process that answered, because a deployment running several
        servers against one database gets a partial view from each.
      properties:
        connections:
          description: Connections are the caller's tenant's live connections on that
            server.
          items:
            $ref: '#/components/schemas/Connection'
          type:
            - array
            - "null"
        counts:
          $ref: '#/components/schemas/ConnectionCounts'
          description: Counts are the totals that go with the list.
        server_id:
          description: ServerID names the server process that answered.
          type: string
      type: object
    ConnectionSurface:
      description: ConnectionSurface names the access path a live connection arrived
        on.
      enum:
        - events
        - ssh
      type: string
    CopyTaskInput:
      description: CopyTaskInput says where a copy of a task goes and what travels
        with it. An empty ProjectRef copies into the source's own project and an empty
        Title keeps the source's.
      properties:
        keep_status:
          description: KeepStatus starts the copy in the source's state when the target
            workflow has one of that name, rather than in its initial state.
          type: boolean
        link:
          description: Link records the source on each copy as its CopiedFromID.
          type: boolean
        project_ref:
          description: ProjectRef is the key or identifier of the project to copy
            into; empty copies into the source's own project.
          type: string
        title:
          description: Title is the copy's title; empty keeps the source's.
          type: string
        with_comments:
          description: WithComments copies the source's comments onto the copy.
          type: boolean
        with_dependencies:
          description: WithDependencies copies dependency edges, pointing an edge
            at the copy of its far end when that was copied too.
          type: boolean
        with_subtasks:
          description: WithSubtasks copies the source's subtasks too, as subtasks
            of the copy.
          type: boolean
      type: object
    CreateInviteInput:
      description: CreateInviteInput invites an email address to this tenant.
      properties:
        display_name:
          description: DisplayName is the name shown for a new account until its owner
            chooses one.
          type: string
        email:
          description: Email is the address to invite, lowercased. Required.
          type: string
        expires_in:
          description: ExpiresIn is how long the link works, such as "48h" or "7d",
            between one hour and 30 days; omitted means 7 days.
          type: string
        handle:
          description: Handle is a new account's short name; empty uses the part of
            the email before the "@".
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the role granted in this tenant; empty means "viewer".
      type: object
    CreateProjectInput:
      description: CreateProjectInput creates a project.
      properties:
        color:
          description: Color is a palette colour name or a custom "#rrggbb"; empty
            means none.
          type: string
        description:
          description: Description is free text shown with the project.
          type: string
        icon:
          description: 'Icon is a text icon: one emoji or a monogram of at most two
            characters. At most one of Icon, IconName and IconFile may be set.'
          type: string
        icon_file:
          $ref: '#/components/schemas/ProjectIconFile'
          description: IconFile is an uploaded image icon. At most one of Icon, IconName
            and IconFile may be set.
        icon_name:
          description: IconName names one of the built-in icons. At most one of Icon,
            IconName and IconFile may be set.
          type: string
        key:
          description: 'Key is the project''s unique key and the prefix of its task
            references, lowercased: letters, digits, hyphens and underscores, starting
            with a letter. Required.'
          type: string
        name:
          description: Name is the project's display name. Required.
          type: string
        workflow_key:
          description: WorkflowKey names the workflow the project's tasks follow;
            empty uses the builtin workflow.
          type: string
      type: object
    CreateTaskRequest:
      description: CreateTaskRequest is the body of a create. Parse reads Title as
        a quick-add line, relative dates counted in UTC since the API knows no reader's
        zone.
      properties:
        assignee_actor_id:
          description: AssigneeActorID is the actor to assign, by identifier or handle.
          type: string
        body:
          description: Body is the Markdown description, up to 1 MiB.
          type: string
        custom_fields:
          additionalProperties: {}
          description: CustomFields holds values for the project's custom fields,
            by field key. A field left out takes its default, and a required one without
            a default is refused.
          type: object
        depends_on:
          description: DependsOn lists references of tasks this task waits on.
          items:
            type: string
          type: array
        due_at:
          description: DueAt is when the task is due, an RFC 3339 timestamp.
          format: date-time
          type:
            - "null"
            - string
        lease:
          description: Lease is how long a claim on the task holds; zero inherits
            the project's.
          type: string
        parent_ref:
          description: ParentRef makes the task a subtask of this task reference.
          type: string
        parse:
          description: 'Parse reads Title as a quick-add line such as "Fix login !high
            #auth @raj due:fri", with relative dates counted in UTC.'
          type: boolean
        priority:
          description: Priority orders tasks in a queue.
          type: integer
        project_ref:
          description: ProjectRef is the key or identifier of the project to create
            the task in. Empty picks the tenant's only project, or its "default" project
            when it has several.
          type: string
        recurrence:
          description: Recurrence is a repeat rule such as "every 2 weeks"; finishing
            the task creates the next occurrence.
          type: string
        status:
          description: Status is the starting state of the project's workflow; empty
            uses the workflow's initial state.
          type: string
        tags:
          description: Tags names the tags to attach, creating any that do not exist.
          items:
            type: string
          type: array
        title:
          description: Title is a one-line summary of at most 500 characters. Required.
          type: string
      type: object
    CreateTenantInput:
      description: CreateTenantInput creates a tenant.
      properties:
        admins:
          description: Admins are the first administrators of the new tenant, each
            created as a user holding the admin role there and nowhere else, in the
            same operation as the tenant. Omitted creates a tenant with no members.
          items:
            $ref: '#/components/schemas/TenantAdminInput'
          type: array
        key:
          description: 'Key is the tenant''s short unique key, lowercased: letters,
            digits, hyphens and underscores, starting with a letter. Required.'
          type: string
        name:
          description: Name is the tenant's display name. Required.
          type: string
      type: object
    CreateTokenInput:
      description: CreateTokenInput mints an API token.
      properties:
        actor_id:
          description: ActorID is the actor the token acts as, by identifier or handle;
            empty means the caller.
          type: string
        expires_at:
          description: ExpiresAt is when the token stops working, an RFC 3339 timestamp;
            omitted means it does not expire.
          format: date-time
          type:
            - "null"
            - string
        name:
          description: Name labels the token, unique among the tenant's live tokens.
            Required.
          type: string
        project_id:
          description: ProjectID confines the token to one project, by key or identifier.
          type: string
        scopes:
          description: Scopes are the permissions the token carries, each one the
            creator must hold. At least one is required.
          items:
            $ref: '#/components/schemas/Scope'
          type:
            - array
            - "null"
      type: object
    CreateUserInput:
      description: CreateUserInput creates a user.
      properties:
        display_name:
          description: DisplayName is the name shown for the user.
          type: string
        email:
          description: Email is the user's sign-in address, lowercased. Required.
          type: string
        handle:
          description: Handle is the user's unique short name, lowercased; empty uses
            the part of the email before the "@".
          type: string
        password:
          description: Password is at least 12 characters; empty creates a user with
            no password.
          type: string
        require_password_change:
          description: RequirePasswordChange makes the first password sign-in choose
            a new password before it is let in. It needs a password.
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the user's role in this tenant; empty means "viewer".
      type: object
    CreatedAdmin:
      description: CreatedAdmin is one administrator created with a tenant.
      properties:
        email:
          description: Email is the administrator's sign-in address.
          type: string
        handle:
          description: Handle is the administrator's handle in the new tenant.
          type: string
        password_generated:
          description: PasswordGenerated is true when the server chose the password,
            which is then in InitialCredentials.
          type: boolean
        user_id:
          description: UserID is the new user's identifier, which is also its actor's.
          type: string
      type: object
    CreatedTenant:
      description: CreatedTenant is a tenant just created, with the administrators
        created alongside it.
      properties:
        admins:
          description: Admins are the administrators created with the tenant, in the
            order they were named.
          items:
            $ref: '#/components/schemas/CreatedAdmin'
          type: array
        created_at:
          description: CreatedAt is when the tenant was created, RFC 3339.
          format: date-time
          type: string
        deleted_at:
          description: DeletedAt is when the tenant was deleted, RFC 3339. Absent
            on a live tenant.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the tenant's unique identifier.
          type: string
        initial_credentials:
          description: InitialCredentials carries every password the server generated,
            in plain text, exactly once. Nothing stores it and no later call returns
            it; a caller that discards it has to set a new password.
          items:
            $ref: '#/components/schemas/InitialCredential'
          type: array
        key:
          description: Key is the tenant's short, unique, human-readable key, used
            to refer to it in place of the ID.
          type: string
        lease_default:
          description: LeaseDefault is how long a claim on this tenant's tasks holds
            when the claim, task, project and workflow name none, as a duration such
            as "4h". Zero or absent defers to the deployment configuration, then the
            built-in default.
          type: string
        lease_max:
          description: LeaseMax caps any lease granted on this tenant's tasks, as
            a duration such as "24h". It can lower the deployment's ceiling but never
            raise it; zero or absent inherits the deployment's.
          type: string
        name:
          description: Name is the tenant's display name.
          type: string
        require_totp_cli:
          description: RequireTOTPCLI requires a second factor when signing in from
            the command line. Defaults to false.
          type: boolean
        require_totp_ssh:
          description: RequireTOTPSSH requires a second factor when opening the board
            over SSH, on top of the key. Defaults to false.
          type: boolean
        require_totp_web:
          description: RequireTOTPWeb requires a second factor when signing in to
            the browser interface. Each surface is set independently and defaults
            to false.
          type: boolean
        theme:
          description: Theme names the palette this tenant presents itself with, on
            every surface. Empty means nobody chose, and the accent is derived from
            the tenant's own identity instead; see ThemeRegistry.Resolve.
          type: string
        trash_off:
          description: TrashOff makes deleting a task permanent on this tenant. False,
            the default, keeps deleted tasks in a trash they can be restored from.
          type: boolean
        updated_at:
          description: UpdatedAt is when the tenant was last changed, RFC 3339.
          format: date-time
          type: string
      type: object
    DeliveryStatus:
      description: DeliveryStatus is the state of one webhook delivery attempt chain.
      enum:
        - pending
        - delivered
        - failed
      type: string
    Dependency:
      description: 'Dependency is a directed edge: Task waits for DependsOn to reach
        a terminal state.'
      properties:
        created_at:
          description: CreatedAt is when the dependency was added, RFC 3339.
          format: date-time
          type: string
        depends_on:
          description: DependsOn is the ID of the task waited for, which must reach
            a terminal state.
          type: string
        task_id:
          description: TaskID is the ID of the task that waits.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns both tasks.
          type: string
      type: object
    DependencyRequest:
      description: DependencyRequest names the task a task waits for.
      properties:
        depends_on:
          description: DependsOn is the reference of the task to wait for, such as
            "OPS-12".
          type: string
      type: object
    Domain:
      description: Domain maps a hostname to a tenant.
      properties:
        cert_mode:
          description: CertMode describes how a domain obtains its TLS certificate.
          type: string
        cert_path:
          description: CertPath is the server-side path of the PEM certificate, set
            when CertMode is "file".
          type: string
        created_at:
          description: CreatedAt is when the domain was added, RFC 3339.
          format: date-time
          type: string
        hostname:
          description: Hostname is the host name requests arrive on, such as "tix.example.com".
          type: string
        id:
          description: ID is the domain's unique identifier.
          type: string
        key_path:
          description: KeyPath is the server-side path of the PEM private key, set
            when CertMode is "file".
          type: string
        tenant_id:
          description: TenantID is the tenant the hostname resolves to.
          type: string
        verified_at:
          description: VerifiedAt is when the hostname was verified, RFC 3339. Absent
            until it is.
          format: date-time
          type:
            - "null"
            - string
      type: object
    EnrolSSHKeyInput:
      description: EnrolSSHKeyInput enrols one public key against an actor.
      properties:
        actor_id:
          description: 'ActorID is the actor the key speaks for. Empty means the calling
            actor, which is the common case: enrolling one''s own key.'
          type: string
        label:
          description: Label is a human note for telling one key from another.
          type: string
        public_key:
          description: PublicKey is the key in authorized_keys form, as ssh-keygen
            writes it.
          type: string
      type: object
    ErrorBody:
      description: ErrorBody is the single error envelope every failing response carries.
      properties:
        code:
          $ref: '#/components/schemas/Kind'
          description: Code is the error kind, which decides the HTTP status.
        details:
          additionalProperties: {}
          description: Details carries structured context when there is some, such
            as "field" naming the input at fault or "reason" refining the kind.
          type: object
        message:
          description: Message is a human-readable explanation.
          type: string
      type: object
    ErrorEnvelope:
      description: ErrorEnvelope wraps ErrorBody so the payload is self-describing.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Error describes what went wrong.
      type: object
    ExportInput:
      description: ExportInput selects what to export.
      properties:
        include_artifacts:
          description: IncludeArtifacts adds the tasks' artifacts.
          type: boolean
        include_comments:
          description: IncludeComments adds the tasks' comments.
          type: boolean
        project_refs:
          description: ProjectRefs restricts the snapshot to these projects, by key
            or identifier; empty exports every project.
          items:
            type: string
          type: array
      type: object
    FieldDef:
      description: FieldDef defines one custom field on a project's tasks.
      properties:
        default:
          description: Default is the value a new task gets when it sets none, coerced
            to Type.
        enum_options:
          description: EnumOptions are the allowed values when Type is "enum".
          items:
            type: string
          type: array
        id:
          description: ID is the field definition's unique identifier.
          type: string
        key:
          description: Key names the field in a task's custom_fields, unique within
            the project.
          type: string
        label:
          description: Label is the field's display name.
          type: string
        position:
          description: Position orders the project's fields, lowest first, ties broken
            by key.
          type: integer
        project_id:
          description: ProjectID is the project whose tasks carry the field.
          type: string
        required:
          description: Required refuses a new task that sets no value for the field
            and has no Default to fall back on.
          type: boolean
        tenant_id:
          description: TenantID is the tenant that owns the field.
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
          description: Type is the type every value of the field must have.
      type: object
    FieldDefInput:
      description: FieldDefInput defines or redefines a custom field.
      properties:
        default:
          description: Default is the value a new task gets when it names none, coerced
            to Type.
        enum_options:
          description: EnumOptions lists the allowed values, required for an enum
            field and refused on any other type.
          items:
            type: string
          type: array
        key:
          description: Key identifies the field within the project and in a task's
            custom_fields; an existing key is redefined. Required.
          type: string
        label:
          description: Label is the name shown for the field; empty uses the key.
          type: string
        position:
          description: Position orders the project's fields, lowest first.
          type: integer
        required:
          description: Required refuses a task that ends up with no value and no default.
          type: boolean
        type:
          $ref: '#/components/schemas/FieldType'
          description: Type is the kind of value the field holds. Required.
      type: object
    FieldType:
      description: FieldType is the type of a custom field's value.
      enum:
        - string
        - text
        - int
        - float
        - bool
        - date
        - datetime
        - enum
        - actor
        - json
      type: string
    ForceReclaimInput:
      description: ForceReclaimInput carries the administrator's reason for taking
        a lease. The reason is optional and is recorded on the audit entry, because
        the question asked of a forced reclaim afterwards is never whether it happened,
        which the entry says, but why somebody else's work was taken.
      properties:
        reason:
          description: Reason says why the lease was taken, at most 500 characters.
          type: string
      type: object
    GlobalAdminInput:
      description: GlobalAdminInput names the user a global admin grant concerns.
      properties:
        email:
          description: Email is the user's sign-in address. Required.
          type: string
      type: object
    GroupOrderInput:
      description: GroupOrderInput is the order a reader put a view's groups in.
      properties:
        groups:
          description: 'Groups names the groups to put first, in that order: at most
            500, each once, spelled as GroupPref.Group is.'
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    GroupPref:
      description: 'GroupPref is one reader''s arrangement of one group on one view:
        whether it is hidden, collapsed to a strip or starred to the front, and where
        it was moved to. It belongs to the actor who set it and changes nothing anybody
        else sees.'
      properties:
        collapsed:
          description: Collapsed draws the group as a narrow strip.
          type: boolean
        group:
          description: 'Group names the group on that view: a state key on a board,
            a project key on lanes, or a deadline bucket on mine.'
          type: string
        hidden:
          description: Hidden leaves the group out of the view.
          type: boolean
        position:
          description: Position is the place the reader moved the group to, from 1,
            or 0 when the group keeps the order the view draws it in.
          type: integer
        starred:
          description: Starred moves the group ahead of the unstarred ones.
          type: boolean
        view:
          description: 'View names the view: board, lanes, mine or project:KEY.'
          type: string
      type: object
    GroupPrefInput:
      description: GroupPrefInput changes one group's preference. A nil field is left
        as it is.
      properties:
        collapsed:
          description: Collapsed collapses or expands the group.
          type:
            - "null"
            - boolean
        hidden:
          description: Hidden hides or shows the group.
          type:
            - "null"
            - boolean
        starred:
          description: Starred stars or unstars the group.
          type:
            - "null"
            - boolean
      type: object
    HealthBody:
      description: HealthBody reports that the process is alive.
      properties:
        status:
          description: Status is always "ok".
          type: string
        version:
          description: Version is the tix version the process runs.
          type: string
      type: object
    HousekeepingCounts:
      description: HousekeepingCounts is how many tasks each rule acts on.
      properties:
        cancelled:
          description: Cancelled is the number of cancelled tasks moved, or due to
            move, to the trash.
          type: integer
        done:
          description: Done is the number of done tasks moved, or due to move, to
            the trash.
          type: integer
        trash:
          description: Trash is the number of trashed tasks deleted, or due to be
            deleted, for good.
          type: integer
      type: object
    HousekeepingInput:
      description: HousekeepingInput changes one level of the policy. Each rule takes
        "off", a number of days ("30" or "30d"), or on a project "inherit"; empty
        leaves it.
      properties:
        cancelled:
          description: 'Cancelled sets the cancelled rule: "off", days, or "inherit"
            on a project.'
          type: string
        done:
          description: 'Done sets the done rule: "off", days ("30" or "30d"), or "inherit"
            on a project.'
          type: string
        project:
          description: Project is the key or ID of the project whose override changes;
            empty changes the tenant default.
          type: string
        trash:
          description: 'Trash sets the trash rule: "off", days, or "inherit" on a
            project.'
          type: string
      type: object
    HousekeepingPolicy:
      description: HousekeepingPolicy is one level's rules in days. On a project a
        nil rule inherits the tenant's; on the tenant a nil rule is off. Zero is off.
      properties:
        cancelled:
          description: Cancelled is the days a cancelled task stays before it moves
            to the trash; null inherits on a project and is off on the tenant, 0 is
            off.
          type:
            - "null"
            - integer
        done:
          description: Done is the days a done task stays before it moves to the trash;
            null inherits on a project and is off on the tenant, 0 is off.
          type:
            - "null"
            - integer
        project_id:
          description: ProjectID is the project this override belongs to, empty for
            the tenant default.
          type: string
        trash:
          description: Trash is the days a task stays in the trash before it is deleted
            for good; null inherits on a project and is off on the tenant, 0 is off.
          type:
            - "null"
            - integer
      type: object
    HousekeepingResult:
      description: HousekeepingResult says what one run did, or would do.
      properties:
        cancelled:
          description: Cancelled is the number of cancelled tasks moved, or due to
            move, to the trash.
          type: integer
        done:
          description: Done is the number of done tasks moved, or due to move, to
            the trash.
          type: integer
        dry_run:
          description: DryRun is true when the run was a preview and changed nothing.
          type: boolean
        paused:
          description: Paused is true while the tenant's trash is off, so no rule
            acted.
          type: boolean
        trash:
          description: Trash is the number of trashed tasks deleted, or due to be
            deleted, for good.
          type: integer
      type: object
    HousekeepingRunInput:
      description: HousekeepingRunInput runs housekeeping once, or previews it.
      properties:
        dry_run:
          description: DryRun counts what a run would act on and changes nothing.
          type: boolean
        limit:
          description: Limit caps the tasks each rule acts on in this run; 0 means
            200, negative is refused.
          type: integer
        project:
          description: Project is the key or ID of one project to run for; empty runs
            every project.
          type: string
      type: object
    HousekeepingView:
      description: HousekeepingView is the policy as one level sees it, with what
        it would act on now. Project, Override and Effective describe the project
        asked about; without one, Effective is the tenant default.
      properties:
        effective:
          $ref: '#/components/schemas/HousekeepingPolicy'
          description: Effective is the policy that applies, with every rule resolved
            to days.
        override:
          $ref: '#/components/schemas/HousekeepingPolicy'
          description: Override is the project's own rules, a null rule inheriting
            the tenant's.
        paused:
          description: 'Paused is true while the tenant''s trash is off: no rule runs
            then.'
          type: boolean
        pending:
          $ref: '#/components/schemas/HousekeepingCounts'
          description: Pending counts the tasks each rule would act on now.
        project:
          description: Project is the key of the project asked about, empty for the
            tenant.
          type: string
        tenant:
          $ref: '#/components/schemas/HousekeepingPolicy'
          description: Tenant is the tenant default policy.
      type: object
    ImportResult:
      description: ImportResult reports what an import did, or would do under a dry
        run.
      properties:
        created:
          additionalProperties:
            type: integer
          description: Created counts the records created, by record kind.
          type:
            - object
            - "null"
        deleted:
          additionalProperties:
            type: integer
          description: Deleted counts the records deleted, by record kind.
          type: object
        dry_run:
          description: DryRun is true when nothing was written.
          type: boolean
        skipped:
          additionalProperties:
            type: integer
          description: Skipped counts the records left alone, by record kind.
          type:
            - object
            - "null"
        updated:
          additionalProperties:
            type: integer
          description: Updated counts the records updated, by record kind.
          type:
            - object
            - "null"
        warnings:
          description: Warnings lists records the import could not take as they were.
          items:
            type: string
          type: array
      type: object
    InboxChannel:
      description: 'InboxChannel is one person''s own delivery endpoint for their
        inbox items: a URL tix posts to, shaped for the service behind it, for the
        kinds the person chose. It is not a tenant webhook and nobody else''s items
        reach it.'
      properties:
        active:
          description: Active is false when the channel is turned off and receives
            nothing.
          type: boolean
        actor_id:
          description: ActorID is the person who owns the channel.
          type: string
        created_at:
          description: CreatedAt is when the channel was created, RFC 3339.
          format: date-time
          type: string
        format:
          $ref: '#/components/schemas/ChannelFormat'
          description: Format shapes the message for the service behind the URL.
        id:
          description: ID identifies the channel.
          type: string
        kinds:
          description: Kinds lists the inbox kinds the channel receives.
          items:
            $ref: '#/components/schemas/InboxKind'
          type:
            - array
            - "null"
        name:
          description: Name labels the channel, unique among its owner's channels
            ignoring case.
          type: string
        url:
          description: URL is where tix posts each message.
          type: string
      type: object
    InboxChannelInput:
      description: InboxChannelInput creates a channel. Kinds empty means every kind.
      properties:
        active:
          description: Active turns the channel on or off; omitted means on.
          type:
            - "null"
            - boolean
        format:
          description: Format is generic, slack, discord or ntfy; empty means generic.
          type: string
        kinds:
          description: Kinds lists the inbox kinds to receive. Omitted means every
            kind; an empty list is refused.
          items:
            type: string
          type: array
        name:
          description: Name labels the channel, at most 80 characters and unique among
            the caller's channels.
          type: string
        url:
          description: URL is where messages are posted; it must be https unless it
            is a loopback address or the server allows insecure webhooks.
          type: string
      type: object
    InboxChannelUpdate:
      description: InboxChannelUpdate changes a channel. A nil field is left as it
        is.
      properties:
        active:
          description: Active turns the channel on or off.
          type:
            - "null"
            - boolean
        format:
          description: 'Format changes the shape: generic, slack, discord or ntfy.'
          type:
            - "null"
            - string
        kinds:
          description: Kinds replaces the inbox kinds received; an empty list is refused.
          items:
            type: string
          type:
            - "null"
            - array
        name:
          description: Name renames the channel, at most 80 characters and unique
            among the caller's channels.
          type:
            - "null"
            - string
        url:
          description: URL changes where messages are posted, under the same rules
            as on creation.
          type:
            - "null"
            - string
      type: object
    InboxCount:
      description: InboxCount is how many of the caller's items are unread.
      properties:
        unread:
          description: Unread is the number of the caller's items not yet read.
          type: integer
      type: object
    InboxItem:
      description: 'InboxItem is one thing that concerned its recipient: a mention,
        an assignment, a comment on a task they follow, or a status change.'
      properties:
        actor_handle:
          description: ActorHandle is that actor's handle, empty when the actor no
            longer exists.
          type: string
        actor_id:
          description: ActorID is the actor whose change produced the item.
          type: string
        comment_id:
          description: CommentID identifies the comment behind a mention or comment
            item.
          type: string
        created_at:
          description: CreatedAt is when the item was written, RFC 3339.
          format: date-time
          type: string
        excerpt:
          description: Excerpt quotes the comment, description or title on one line,
            cut to 200 characters.
          type: string
        from_status:
          description: FromStatus is the status a task left, set on a status item
            only.
          type: string
        id:
          description: ID identifies the item, for marking it read or unread.
          type: string
        kind:
          $ref: '#/components/schemas/InboxKind'
          description: Kind is why the item reached its recipient, the strongest reason
            when one change concerned them for several.
        read_at:
          description: ReadAt is when the recipient marked the item read, RFC 3339,
            absent while it is unread.
          format: date-time
          type:
            - "null"
            - string
        recipient_id:
          description: RecipientID is the actor the item is for, always the caller
            on a read.
          type: string
        task_gone:
          description: TaskGone is set when the task has since been deleted.
          type: boolean
        task_id:
          description: TaskID identifies the task the item is about.
          type: string
        task_ref:
          description: TaskRef is the task's reference, such as OPS-12, filled in
            when the item is read back.
          type: string
        task_title:
          description: TaskTitle is the task's current title, filled in when the item
            is read back.
          type: string
        to_status:
          description: ToStatus is the status a task entered, set on a status item
            only.
          type: string
      type: object
    InboxKind:
      description: InboxKind names why an inbox item reached its recipient.
      enum:
        - mention
        - assigned
        - status
        - comment
      type: string
    InboxPrefs:
      description: InboxPrefs is the caller's choice of kinds that create no item
        for them.
      properties:
        muted:
          description: Muted lists the kinds that create no inbox item for the caller.
          items:
            $ref: '#/components/schemas/InboxKind'
          type:
            - array
            - "null"
      type: object
    InboxPrefsInput:
      description: InboxPrefsInput replaces the caller's muted kinds.
      properties:
        muted:
          description: 'Muted is the complete list of kinds to mute: mention, assigned,
            status or comment. An empty list mutes nothing.'
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    InboxReadAll:
      description: InboxReadAll reports how many items marking everything read changed.
      properties:
        marked:
          description: Marked is how many unread items were marked read.
          type: integer
      type: object
    InitialCredential:
      description: InitialCredential is a generated password, shown once.
      properties:
        email:
          description: Email is the address the password signs in with.
          type: string
        handle:
          description: Handle is the administrator's handle in the new tenant.
          type: string
        password:
          description: Password is the generated password in plain text.
          type: string
      type: object
    Installation:
      description: Installation describes the store the report was taken against.
      properties:
        engine:
          description: Engine is the database engine, "sqlite" or "postgres".
          type: string
        observed_at:
          description: ObservedAt is the instant every staleness judgement in this
            report was made against.
          format: date-time
          type: string
        schema_version:
          description: SchemaVersion is the highest database migration applied.
          type: integer
        store:
          description: Store is the resolved target, with any password already redacted.
          type: string
        version:
          description: Version is the tix version that produced the report.
          type: string
      type: object
    Invite:
      description: 'Invite is a pending or finished invitation to sign in to this
        tenant. The secret that accepts it is never part of it: only IssuedInvite
        carries that, and only on the call that minted it.'
      properties:
        accepted_at:
          description: AcceptedAt is when the link was used, RFC 3339; absent while
            pending.
          format: date-time
          type:
            - "null"
            - string
        created_at:
          description: CreatedAt is when the invite was issued, RFC 3339.
          format: date-time
          type: string
        email:
          description: Email is the invited address.
          type: string
        existing_account:
          description: ExistingAccount reports that the account already had a password
            when it was invited, so accepting confirms that password instead of setting
            one.
          type: boolean
        expires_at:
          description: ExpiresAt is when the link stops working, RFC 3339.
          format: date-time
          type: string
        id:
          description: ID identifies the invite, for listing, revoking and re-issuing
            it.
          type: string
        invited_by:
          description: InvitedBy is the actor who issued the invite.
          type: string
        invited_by_handle:
          description: InvitedByHandle is that actor's handle, empty when it no longer
            exists.
          type: string
        revoked_at:
          description: RevokedAt is when the link was revoked or replaced, RFC 3339;
            absent while pending.
          format: date-time
          type:
            - "null"
            - string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the role the invite granted in this tenant.
        tenant_id:
          description: TenantID is the tenant the invite admits to.
          type: string
        user_id:
          description: UserID is the invited account, created when the invite was
            issued.
          type: string
      type: object
    InvitePreview:
      description: InvitePreview is what the person holding a live invite link is
        shown before accepting it. It names the account and nothing about who else
        exists.
      properties:
        display_name:
          description: DisplayName is the account's current display name.
          type: string
        email:
          description: Email is the invited address.
          type: string
        existing_account:
          description: ExistingAccount reports that the account already has a password,
            which accepting confirms rather than replaces.
          type: boolean
        expires_at:
          description: ExpiresAt is when the link stops working, RFC 3339.
          format: date-time
          type: string
        tenant_name:
          description: TenantName is the tenant the invite admits to.
          type: string
      type: object
    IssuedCalendarFeed:
      description: IssuedCalendarFeed carries a feed together with its freshly minted
        secret. Path is the route the secret is read at; URL is that route made absolute
        by a surface that knows the address it was reached at, and is empty otherwise.
      properties:
        actor_id:
          description: ActorID is the feed's owner, whose access it reads with.
          type: string
        created_at:
          description: CreatedAt is when this secret was issued, RFC 3339.
          format: date-time
          type: string
        filter:
          description: Filter is the task filter expression the feed selects with.
            Empty means the tasks assigned to the owner that are not finished.
          type: string
        id:
          description: ID identifies the feed.
          type: string
        path:
          description: 'Path is the route a calendar app reads the feed at, with no
            credential: /api/v1/calendar/feeds/TOKEN.ics.'
          type: string
        revoked_at:
          description: RevokedAt is when the feed stopped answering, RFC 3339, absent
            while it is live.
          format: date-time
          type:
            - "null"
            - string
        tenant_id:
          description: TenantID identifies the tenant the feed reads.
          type: string
        token:
          description: Token is the secret that addresses the feed, returned only
            by the call that minted it.
          type: string
        url:
          description: URL is Path made absolute, empty when the surface does not
            know its own address.
          type: string
      type: object
    IssuedInboxChannel:
      description: 'IssuedInboxChannel is a channel as it is created: the only answer
        that carries its signing secret, which no later read returns.'
      properties:
        active:
          description: Active is false when the channel is turned off and receives
            nothing.
          type: boolean
        actor_id:
          description: ActorID is the person who owns the channel.
          type: string
        created_at:
          description: CreatedAt is when the channel was created, RFC 3339.
          format: date-time
          type: string
        format:
          $ref: '#/components/schemas/ChannelFormat'
          description: Format shapes the message for the service behind the URL.
        id:
          description: ID identifies the channel.
          type: string
        kinds:
          description: Kinds lists the inbox kinds the channel receives.
          items:
            $ref: '#/components/schemas/InboxKind'
          type:
            - array
            - "null"
        name:
          description: Name labels the channel, unique among its owner's channels
            ignoring case.
          type: string
        secret:
          description: SigningSecret is the secret that signs the channel's generic
            deliveries, returned on creation only.
          type: string
        url:
          description: URL is where tix posts each message.
          type: string
      type: object
    IssuedInvite:
      description: IssuedInvite carries an invite together with its freshly minted
        secret. Path is the browser route that accepts it; URL is that route made
        absolute by a surface that knows the address it was reached at, and is empty
        otherwise.
      properties:
        accepted_at:
          description: AcceptedAt is when the link was used, RFC 3339; absent while
            pending.
          format: date-time
          type:
            - "null"
            - string
        created_at:
          description: CreatedAt is when the invite was issued, RFC 3339.
          format: date-time
          type: string
        email:
          description: Email is the invited address.
          type: string
        existing_account:
          description: ExistingAccount reports that the account already had a password
            when it was invited, so accepting confirms that password instead of setting
            one.
          type: boolean
        expires_at:
          description: ExpiresAt is when the link stops working, RFC 3339.
          format: date-time
          type: string
        id:
          description: ID identifies the invite, for listing, revoking and re-issuing
            it.
          type: string
        invited_by:
          description: InvitedBy is the actor who issued the invite.
          type: string
        invited_by_handle:
          description: InvitedByHandle is that actor's handle, empty when it no longer
            exists.
          type: string
        path:
          description: 'Path is the browser route the invited person opens: /invite/TOKEN.'
          type: string
        revoked_at:
          description: RevokedAt is when the link was revoked or replaced, RFC 3339;
            absent while pending.
          format: date-time
          type:
            - "null"
            - string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the role the invite granted in this tenant.
        tenant_id:
          description: TenantID is the tenant the invite admits to.
          type: string
        token:
          description: Token is the secret that accepts the invite, returned only
            by the call that minted it.
          type: string
        url:
          description: URL is Path made absolute, empty when the surface does not
            know its own address.
          type: string
        user_id:
          description: UserID is the invited account, created when the invite was
            issued.
          type: string
      type: object
    IssuedToken:
      description: IssuedToken carries a newly minted token value.
      properties:
        actor_id:
          description: ActorID is the actor the token acts as.
          type: string
        created_at:
          description: CreatedAt is when the token was issued, RFC 3339.
          format: date-time
          type: string
        expires_at:
          description: ExpiresAt is when the token stops authenticating, RFC 3339.
            Absent means it never expires.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the token's identifier, used to list and revoke it. It
            is not the secret.
          type: string
        last_used_at:
          description: LastUsedAt is when the token last authenticated a request,
            RFC 3339. Absent if never used.
          format: date-time
          type:
            - "null"
            - string
        name:
          description: Name is the label given to the token when it was created.
          type: string
        project_id:
          description: ProjectID restricts the token to one project when set. Empty
            means every project the actor can reach.
          type: string
        revoked_at:
          description: RevokedAt is when the token was revoked, RFC 3339. A revoked
            token never authenticates again.
          format: date-time
          type:
            - "null"
            - string
        scopes:
          description: Scopes are the permissions the token carries; a request outside
            them is refused.
          items:
            $ref: '#/components/schemas/Scope'
          type:
            - array
            - "null"
        tenant_id:
          description: TenantID is the tenant the token authenticates to.
          type: string
        token:
          description: Token is the secret bearer value. It is returned only when
            the token is issued and cannot be read again.
          type: string
      type: object
    Kind:
      description: Kind classifies an error so every transport can map it consistently.
      enum:
        - invalid
        - not_found
        - conflict
        - unauthenticated
        - forbidden
        - lease_expired
        - no_task_available
        - precondition_failed
        - upstream
        - internal
      type: string
    LeaseGrant:
      description: 'LeaseGrant is the lease a claim is, or would be, granted on one
        task: its length and the level it came from, and the ceiling and the level
        setting it. Clamped reports a length cut down to the ceiling.'
      properties:
        clamped:
          description: Clamped reports that the requested or inherited length was
            cut down to Max.
          type: boolean
        max:
          description: Max is the ceiling a lease on the task may not exceed, as a
            duration such as "24h".
          type: string
        max_source:
          $ref: '#/components/schemas/LeaseSource'
          description: MaxSource is the level Max was taken from.
        source:
          $ref: '#/components/schemas/LeaseSource'
          description: Source is the level TTL was taken from.
        ttl:
          description: TTL is the lease length granted, as a duration such as "4h".
          type: string
      type: object
    LeaseSource:
      description: LeaseSource names the level a lease length or ceiling was taken
        from.
      enum:
        - claim
        - task
        - project
        - workflow
        - tenant
        - deployment
        - builtin
      type: string
    LoginRequest:
      description: LoginRequest carries one step of an interactive sign-in. The first
        step sends the address, the password and the surface; the second sends the
        ticket the challenge answered with and the code.
      properties:
        code:
          description: Code is the six-digit TOTP code or a recovery code, in the
            second step.
          type: string
        email:
          description: Email identifies the user, in the first step.
          type: string
        new_password:
          description: NewPassword replaces the password, sent with the email and
            password again after a password_change challenge.
          type: string
        password:
          description: Password is the user's password, in the first step.
          type: string
        surface:
          $ref: '#/components/schemas/Surface'
          description: Surface is the sign-in path the session is for, which decides
            whether a second factor is required.
        ticket:
          description: Ticket is the challenge ticket from the first step, in the
            second step.
          type: string
      type: object
    LoginResult:
      description: LoginResult is either a session or the challenge standing between
        the caller and one. Exactly one of the two is set.
      properties:
        challenge:
          $ref: '#/components/schemas/TOTPChallenge'
          description: Challenge is set when a second factor or a new password is
            still needed.
        recovery_codes:
          description: RecoveryCodes is set once, when a sign-in completed by enrolling.
            The caller must show them and cannot ask for them again.
          items:
            type: string
          type: array
        session:
          $ref: '#/components/schemas/Session'
          description: Session is the new session, set when sign-in is complete.
      type: object
    Membership:
      description: Membership grants a human a role within one tenant.
      properties:
        actor_id:
          description: ActorID is the member's actor ID.
          type: string
        created_at:
          description: CreatedAt is when the membership was granted, RFC 3339.
          format: date-time
          type: string
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the role granted, which decides the member's scopes.
        tenant_id:
          description: TenantID is the tenant the membership belongs to.
          type: string
      type: object
    Project:
      description: Project groups tasks and is assigned exactly one workflow.
      properties:
        archived_at:
          description: ArchivedAt is when the project was archived, RFC 3339. Absent
            on an active project.
          format: date-time
          type:
            - "null"
            - string
        color:
          description: 'ProjectColor is a project''s colour: one swatch of the fixed
            palette, which every scheme renders with its own tuned shade, or a custom
            #rrggbb value, which every scheme renders as near to itself as stays legible.'
          type: string
        created_at:
          description: CreatedAt is when the project was created, RFC 3339.
          format: date-time
          type: string
        description:
          description: Description is free text about the project.
          type: string
        icon:
          description: Icon is a text icon, one emoji or a one or two letter monogram.
            At most one of Icon, IconName and IconImage is set.
          type: string
        icon_image:
          description: IconImage is the digest of an uploaded icon image, whose bytes
            are read from the project's icon route. Empty when the project has no
            image.
          type: string
        icon_name:
          description: IconName names one of the built-in icons, such as "rocket"
            or "bug".
          type: string
        id:
          description: ID is the project's unique identifier.
          type: string
        key:
          description: Key is the project's short unique key, which prefixes its task
            references such as "INFRA-42".
          type: string
        lease_default:
          description: LeaseDefault is how long a claim on this project's tasks holds
            when neither the claim nor the task says, as a duration such as "4h".
            It outranks the workflow and the tenant; zero or absent inherits.
          type: string
        lease_max:
          description: LeaseMax caps any lease granted on this project's tasks, as
            a duration such as "24h". It narrows the tenant's ceiling and never raises
            it; zero or absent inherits.
          type: string
        name:
          description: Name is the project's display name.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the project.
          type: string
        updated_at:
          description: UpdatedAt is when the project was last changed, RFC 3339.
          format: date-time
          type: string
        workflow_id:
          description: WorkflowID is the ID of the workflow the project's tasks follow.
          type: string
      type: object
    ProjectDeletion:
      description: ProjectDeletion is what deleting a project does, or did, to its
        tasks.
      properties:
        delete_tasks:
          description: DeleteTasks reports that the tasks go permanently with the
            project.
          type: boolean
        deleted:
          description: Deleted counts the project's soft deleted tasks, in the trash.
          type: integer
        dry_run:
          description: 'DryRun marks a plan: what the deletion would do, nothing written.'
          type: boolean
        move_to:
          description: MoveTo is the target's key when the tasks move.
          type: string
        project:
          description: Project is the key of the project being deleted.
          type: string
        statuses:
          description: Statuses is the mapping a move applies, one entry per source
            status.
          items:
            $ref: '#/components/schemas/StatusMove'
          type: array
        tasks:
          description: Tasks counts the project's live tasks.
          type: integer
      type: object
    ProjectIconFile:
      description: 'ProjectIconFile is an image a caller uploads as a project''s icon.
        The declared content type is advisory: the bytes decide.'
      properties:
        content_type:
          description: ContentType is the declared media type, advisory only; the
            bytes decide.
          type: string
        data:
          description: 'Data is the image, base64 in JSON: a PNG, JPEG, WebP or script-free
            SVG of at most 64 KiB. Empty asks for no image.'
          format: base64
          type: string
      type: object
    PruneInput:
      description: PruneInput removes records past their retention window.
      properties:
        dry_run:
          description: DryRun reports what would be removed and removes nothing.
          type: boolean
        limit:
          description: Limit caps how many rows of each kind one run removes; 0 means
            500.
          type: integer
      type: object
    PruneResult:
      description: PruneResult reports what pruning removed, or would remove under
        a dry run.
      properties:
        audit_entries:
          description: AuditEntries counts the audit entries removed.
          format: int64
          type: integer
        dry_run:
          description: DryRun is true when nothing was removed.
          type: boolean
        events:
          description: Events counts the events removed.
          format: int64
          type: integer
        retained_for_subscribers:
          description: RetainedForSubscribers counts events past their window kept
            because a subscriber has not consumed them yet.
          format: int64
          type: integer
        webhook_deliveries:
          description: WebhookDeliveries counts the webhook delivery records removed.
          format: int64
          type: integer
      type: object
    ReadyBody:
      description: ReadyBody reports whether the server can serve traffic.
      properties:
        checks:
          description: Checks are the individual probes and their outcomes.
          items:
            $ref: '#/components/schemas/Check'
          type:
            - array
            - "null"
        ready:
          description: Ready is true when every check passed.
          type: boolean
      type: object
    ReissueInviteInput:
      description: ReissueInviteInput replaces a pending invite's link.
      properties:
        expires_in:
          description: ExpiresIn is how long the new link works, between one hour
            and 30 days; omitted means 7 days.
          type: string
      type: object
    ReleaseRequest:
      description: ReleaseRequest gives up a lease held under a token.
      properties:
        comment:
          description: Comment is added to the task as a comment.
          type: string
        result:
          additionalProperties: {}
          description: Result is recorded as a "result" artifact named "result".
          type: object
        status:
          description: Status moves the task to this status as it is released; empty
            leaves the status as it is.
          type: string
        token:
          description: Token is the lease token the claim returned.
          type: string
      type: object
    RenewRequest:
      description: RenewRequest extends a lease held under a token.
      properties:
        token:
          description: Token is the lease token the claim returned.
          type: string
        ttl:
          description: TTL is the new lease length from now, such as "30m" or "4h";
            omitted takes the default a fresh claim would get. The lease cap still
            applies.
          type: string
      type: object
    RetentionPolicy:
      description: RetentionPolicy bounds how long a tenant keeps its append-only
        tables.
      properties:
        audit_entries:
          description: AuditEntries is how long audit entries are kept, as a duration
            such as "8760h". The default is 365 days.
          type: string
        events:
          description: Events is how long events are kept, as a duration such as "720h".
            The default is 30 days.
          type: string
        tenant_id:
          description: TenantID is the tenant the policy applies to.
          type: string
        webhook_deliveries:
          description: WebhookDeliveries is how long webhook delivery records are
            kept, as a duration. The default is 30 days.
          type: string
      type: object
    Role:
      description: Role is a named bundle of scopes granted to a human within one
        tenant.
      enum:
        - viewer
        - member
        - admin
      type:
        - "null"
        - string
    RouteInput:
      description: RouteInput moves a task along a route, one ordinary transition
        per hop. A caller either names the whole route or names the destination and
        lets the workflow find it. Naming both is refused rather than reconciled,
        because the two can disagree and no reading of the pair is obviously right.
      properties:
        comment:
          description: Comment is attached to every hop's transition.
          type: string
        custom_fields:
          additionalProperties: {}
          description: CustomFields are custom field values set on the last hop, keyed
            by field definition key.
          type: object
        lease_token:
          description: LeaseToken proves the caller's claim when the task is leased.
          type: string
        route:
          description: Route lists the states to pass through in order, the current
            one left out, each once; set this or To.
          items:
            type: string
          type: array
        to:
          description: To is the destination state, reached by the route the workflow
            finds; set this or Route.
          type: string
        version:
          description: Version is the task version the move was based on, checked
            on the first hop; a stale one is a conflict and omitted skips the check.
          type: integer
      type: object
    RouteResult:
      description: RouteResult reports what a route actually did, which is not always
        what it asked for. A route that stops halfway leaves the task somewhere, and
        a caller told only that it failed would have to go and look.
      properties:
        applied:
          description: Applied lists the states the task actually entered, in order.
          items:
            type: string
          type:
            - array
            - "null"
        from:
          description: From is the status the task started in.
          type: string
        reason:
          description: Reason is why that hop was refused.
          type: string
        route:
          description: Route is the full list of states the move set out to pass through.
          items:
            type: string
          type:
            - array
            - "null"
        stopped:
          description: Stopped is the state a hop was refused for, empty when the
            route completed.
          type: string
        task:
          $ref: '#/components/schemas/Task'
          description: Task is the task as it stands after the last hop that landed.
      type: object
    RunSyncInput:
      description: RunSyncInput runs an import from a configured source.
      properties:
        dry_run:
          description: DryRun reports what the run would import and writes nothing.
          type: boolean
        full:
          description: Full reads the source from the beginning instead of resuming
            from the stored cursor.
          type: boolean
        source_id:
          description: SourceID is the identifier of the registered source to run.
            Required.
          type: string
      type: object
    SSHChallenge:
      description: SSHChallenge is what a client signs to prove it holds a key. Nonce
        is opaque and signed by the server; Namespace is what the server expects the
        signature to be made under, which a client checks against its own idea of
        the host rather than adopting.
      properties:
        expires_at:
          description: ExpiresAt is when the nonce stops being accepted, two minutes
            after issue, RFC 3339.
          format: date-time
          type: string
        namespace:
          description: Namespace is the sshsig namespace the signature must be made
            under, "tix-login@" followed by the host.
          type: string
        nonce:
          description: Nonce is the opaque, server-signed value to sign.
          type: string
      type: object
    SSHKey:
      description: 'SSHKey is a public key enrolled against an actor, letting that
        actor reach the terminal interface over SSH without a password. The key is
        a credential, so it is tenant-scoped like every other credential here: the
        same public key enrolled in two tenants is two rows, and revoking one leaves
        the other standing. Fingerprint is the SHA-256 form an ssh client prints,
        so what an operator compares by eye is what is stored.'
      properties:
        actor_id:
          description: ActorID is the actor the key signs in as.
          type: string
        created_at:
          description: CreatedAt is when the key was enrolled, RFC 3339.
          format: date-time
          type: string
        fingerprint:
          description: Fingerprint is the key's SHA-256 fingerprint as ssh prints
            it ("SHA256:...").
          type: string
        id:
          description: ID identifies the enrolment; revoke a key by it.
          type: string
        label:
          description: Label is a human note for telling one key from another.
          type: string
        last_used_at:
          description: LastUsedAt is when the key last authenticated, absent if never.
          format: date-time
          type:
            - "null"
            - string
        public_key:
          description: PublicKey is the key in authorized_keys form.
          type: string
        revoked_at:
          description: RevokedAt is when the key was revoked, absent while it still
            works.
          format: date-time
          type:
            - "null"
            - string
        tenant_id:
          description: TenantID is the tenant the key is enrolled in.
          type: string
      type: object
    SSHLoginInput:
      description: SSHLoginInput is the signed answer to a challenge.
      properties:
        nonce:
          description: Nonce is the nonce from the challenge being answered.
          type: string
        public_key:
          description: PublicKey is the key in authorized_keys form.
          type: string
        signature:
          description: Signature is the armored sshsig block over the nonce.
          type: string
        tenant:
          description: Tenant, when set, is the tenant key the caller means. A server
            that resolved another one refuses rather than signing in somewhere else.
          type: string
      type: object
    SaveTemplateInput:
      description: SaveTemplateInput names a task to keep as a template.
      properties:
        due_in:
          description: DueIn is how far from a use the task falls due, a duration
            such as "3d" of at most ten years; omitted means no due date.
          type: string
        name:
          description: 'Name labels the template: required, at most 100 characters,
            unique in the tenant ignoring case.'
          type: string
        task_ref:
          description: TaskRef is the live task to keep, by reference such as OPS-12
            or by id.
          type: string
        tenant_wide:
          description: TenantWide shares the template with every project rather than
            keeping it in the task's own.
          type: boolean
        with_subtasks:
          description: WithSubtasks keeps the task's live subtasks too, at most 200
            tasks in all.
          type: boolean
      type: object
    SavedFilter:
      description: 'SavedFilter is a named task filter one reader keeps: the expression,
        the view and the sort the task screen opens with. It belongs to its owner,
        and a shared one is listed for everybody in the tenant.'
      properties:
        created_at:
          description: CreatedAt is when the filter was saved, RFC 3339.
          format: date-time
          type: string
        editable:
          description: 'Editable reports whether the caller may change the filter:
            its owner or an administrator.'
          type: boolean
        id:
          description: ID identifies the filter.
          type: string
        mine:
          description: Mine reports whether the caller owns the filter.
          type: boolean
        name:
          description: Name labels the filter, unique among its owner's filters ignoring
            case.
          type: string
        owner_id:
          description: OwnerID is the actor who owns the filter.
          type: string
        position:
          description: Position is where the owner put the filter among their own,
            from 1.
          type: integer
        query:
          description: Query is the task filter expression, as typed on the task screen.
          type: string
        shared:
          description: Shared lists the filter for every reader of the tenant. Only
            its owner and an administrator may change it.
          type: boolean
        sort:
          description: Sort is the task field the listing is ordered by, empty for
            the default.
          type: string
        updated_at:
          description: UpdatedAt is when the filter last changed, RFC 3339.
          format: date-time
          type: string
        view:
          description: 'View is the view the task screen opens in: list, board or
            lanes, or empty to keep the reader''s current view.'
          type: string
      type: object
    SavedFilterInput:
      description: SavedFilterInput creates a saved filter.
      properties:
        name:
          description: 'Name labels the filter: required, at most 80 characters, unique
            among the caller''s filters.'
          type: string
        query:
          description: Query is the task filter expression, at most 2000 bytes.
          type: string
        shared:
          description: Shared lists the filter for every reader of the tenant.
          type: boolean
        sort:
          description: Sort is one of urgency, created_at, updated_at, priority, due_at,
            seq or title; empty uses the default ordering.
          type: string
        view:
          description: View is list, board or lanes; empty keeps the reader's current
            view.
          type: string
      type: object
    SavedFilterOrderInput:
      description: SavedFilterOrderInput is the order a reader put their own filters
        in.
      properties:
        filters:
          description: Filters names the caller's own filters by id or name, in the
            order wanted; filters left out keep their relative order after them.
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SavedFilterUpdate:
      description: SavedFilterUpdate changes a saved filter. A nil field is left as
        it is.
      properties:
        name:
          description: Name renames the filter, under the same rules as on creation.
          type:
            - "null"
            - string
        query:
          description: Query replaces the filter expression.
          type:
            - "null"
            - string
        shared:
          description: Shared shares the filter with the tenant or takes it back.
          type:
            - "null"
            - boolean
        sort:
          description: Sort replaces the ordering; the empty string restores the default.
          type:
            - "null"
            - string
        view:
          description: View replaces the view; the empty string clears it.
          type:
            - "null"
            - string
      type: object
    Scope:
      description: Scope is a coarse permission over a resource and verb, such as
        "task:claim".
      enum:
        - '*'
        - task:read
        - task:write
        - task:transition
        - task:claim
        - task:delete
        - task:reclaim
        - project:read
        - project:write
        - workflow:read
        - workflow:write
        - comment:write
        - artifact:write
        - event:subscribe
        - user:admin
        - totp:admin
        - token:admin
        - webhook:admin
        - tenant:admin
        - sync:admin
        - global:admin
        - audit:read
        - export
        - import
      type: string
    ServerStatus:
      description: 'ServerStatus is one server as a reader receives it: the stored
        row spelled out, plus the two things only a reader can supply. The row''s
        fields are repeated rather than embedded because an embedded struct inlines
        by default in one encoder and nests in the other, and the JSON shape here
        is a contract that should not depend on which of the two somebody reads it
        through.'
      properties:
        address:
          description: Address is the address the process listens on.
          type: string
        attached:
          description: Attached is the reader's own staleness judgement, carried in
            the document so that no consumer has to know the threshold. Two consumers
            deriving it separately is how two dashboards come to disagree.
          type: boolean
        connections:
          description: Connections is how many connections this server is holding,
            and is set only for the server that produced the report. A nil is "not
            known", which is not the same claim as zero, so it is omitted rather than
            rendered.
          type:
            - "null"
            - integer
        heartbeat_interval:
          description: HeartbeatInterval is the cadence this server beats at, resolved
            to the default for a row that predates the column. Attached is judged
            against three of it, so a consumer that wants a finer judgement than the
            boolean has the threshold rather than having to assume one.
          type: string
        id:
          description: ID identifies the server process.
          type: string
        last_seen_at:
          description: LastSeenAt is the process's last heartbeat, RFC 3339.
          format: date-time
          type: string
        started_at:
          description: StartedAt is when the process registered, RFC 3339.
          format: date-time
          type: string
        surfaces:
          description: Surfaces are what the process serves.
          items:
            description: ServerSurface names a surface a server process serves.
            type: string
          type:
            - array
            - "null"
        uptime:
          description: Uptime is how long the process had been running when the report
            was taken, so a reader need not subtract two instants to learn it.
          type: string
        version:
          description: Version is the tix version the process runs.
          type: string
      type: object
    Session:
      description: Session is a browser or terminal login.
      properties:
        actor_id:
          description: ActorID is the actor the session acts as.
          type: string
        expires_at:
          description: ExpiresAt is when the session stops working, in RFC 3339.
          format: date-time
          type: string
        tenant_id:
          description: TenantID is the tenant the session belongs to.
          type: string
        token:
          description: Token is the session secret, presented as the session cookie.
          type: string
      type: object
    SnoozeInput:
      description: SnoozeInput says until when a task sleeps.
      properties:
        until:
          description: Until is when the task wakes, an RFC 3339 timestamp in the
            future, truncated to the second. Required.
          format: date-time
          type: string
      type: object
    Source:
      description: Source records which access path an operation arrived through.
      enum:
        - cli
        - api
        - web
        - tui
        - system
      type: string
    State:
      description: State is one node of a workflow's state machine.
      properties:
        category:
          $ref: '#/components/schemas/StateCategory'
          description: 'Category groups the state for display and reporting. Empty
            derives one: done when terminal, todo for the initial state, in progress
            otherwise.'
        key:
          description: Key identifies the state within its workflow and is what a
            task's status holds.
          type: string
        label:
          description: Label is the state's display name.
          type: string
        revert_on_lease_expiry:
          description: RevertOnLeaseExpiry moves a task in this state to RevertTo
            when its claim runs out.
          type: boolean
        revert_to:
          description: RevertTo is the state a task returns to when RevertOnLeaseExpiry
            applies.
          type: string
        terminal:
          description: 'Terminal marks a state that ends the work: reaching it completes
            the task and satisfies dependencies on it.'
          type: boolean
      type: object
    StateCategory:
      description: 'StateCategory groups workflow states for display and reporting.
        The vocabulary is fixed rather than open, and a state carries a category rather
        than a colour of its own, so that a colour means the same thing in every deployment:
        one tenant''s red cannot be another tenant''s green, and a terminal that renders
        no colour at all still has a word to fall back on.'
      enum:
        - todo
        - in_progress
        - blocked
        - waiting
        - done
        - cancelled
      type: string
    Stats:
      description: Stats is one tenant's throughput, ageing and leaderboard over a
        window. Every count is zero and every list empty when nothing happened, which
        is a successful answer rather than an error.
      properties:
        by_category:
          description: ByCategory counts the tasks presently in each state category.
          items:
            $ref: '#/components/schemas/StatsCategory'
          type:
            - array
            - "null"
        completed:
          description: Completed is how many tasks reached a terminal state in the
            window.
          type: integer
        created:
          description: Created is how many tasks were created in the window.
          type: integer
        leaderboard_measure:
          description: LeaderboardMeasure states what TopActors counts, for every
            surface that shows it.
          type: string
        median_lead_time:
          description: MedianLeadTime is the median time from creation to terminal
            state over the tasks that reached one inside the window.
          type: string
        oldest:
          description: Oldest are the longest-waiting tasks not yet in a terminal
            state, oldest first.
          items:
            $ref: '#/components/schemas/StatsAgeing'
          type:
            - array
            - "null"
        per_day:
          description: PerDay is the completion series by UTC day, oldest first; days
            with no completion are absent.
          items:
            $ref: '#/components/schemas/StatsDay'
          type:
            - array
            - "null"
        project_id:
          description: ProjectID is the project's ID, set only when the read named
            one project.
          type: string
        project_key:
          description: ProjectKey is the project's key, set only when the read named
            one project.
          type: string
        since:
          description: Since is the start of the window, RFC 3339.
          format: date-time
          type: string
        slowest_lead_time:
          description: SlowestLeadTime is the longest such creation-to-terminal time.
          type: string
        top_actors:
          description: TopActors are the actors who moved the most tasks to a terminal
            state in the window, most first.
          items:
            $ref: '#/components/schemas/StatsActor'
          type:
            - array
            - "null"
        until:
          description: Until is the end of the window, the moment of the read, RFC
            3339.
          format: date-time
          type: string
      type: object
    StatsActor:
      description: 'StatsActor counts the tasks one actor moved to a terminal state.
        See StatsLeaderboardMeasure: the count is of moves, not of work done.'
      properties:
        actor_id:
          description: ActorID is the actor who made the moves.
          type: string
        handle:
          description: Handle is the actor's handle, when it is known.
          type: string
        moved:
          description: Moved is how many tasks the actor moved to a terminal state
            in the window.
          type: integer
      type: object
    StatsAgeing:
      description: StatsAgeing is one task that has not reached a terminal state,
        and how long it has been waiting.
      properties:
        age:
          description: Age is how long since the task was created, as a duration string.
          type: string
        created_at:
          description: CreatedAt is when the task was created, RFC 3339.
          format: date-time
          type: string
        ref:
          description: Ref is the task's reference, such as "OPS-12".
          type: string
        status:
          description: Status is the task's current state key.
          type: string
        title:
          description: Title is the task's title.
          type: string
      type: object
    StatsCategory:
      description: StatsCategory is how many tasks are presently in one state category.
      properties:
        category:
          $ref: '#/components/schemas/StateCategory'
          description: Category is the state category counted.
        count:
          description: Count is how many tasks are in a state of that category now.
          type: integer
      type: object
    StatsDay:
      description: StatsDay is one day of the completion series, keyed by its UTC
        date.
      properties:
        completed:
          description: Completed is how many tasks reached a terminal state that day.
          type: integer
        date:
          description: Date is the UTC calendar day, YYYY-MM-DD.
          type: string
      type: object
    StatusMove:
      description: StatusMove is one source status, the target status it maps to and
        how many tasks it carries.
      properties:
        from:
          description: From is the status in the deleted project's workflow.
          type: string
        tasks:
          description: Tasks counts the tasks in From.
          type: integer
        to:
          description: To is the status the tasks take in the target project's workflow.
          type: string
      type: object
    StatusReport:
      description: StatusReport is the whole answer to "what exists and what is running".
      properties:
        answering_server:
          description: 'AnsweringServer identifies the server that produced this report.
            It is known whether or not that server has registered itself, which Servers
            is not: a server started with --no-registry serves this request and appears
            in no row, so a report without this field says nothing is attached while
            something is demonstrably answering. Empty when the report was produced
            against a database directly, with no server in the picture at all, which
            is the one case where "nothing is serving this store" is true.'
          type: string
        installation:
          $ref: '#/components/schemas/Installation'
          description: Installation describes the store and the build that read it.
        second_factor:
          $ref: '#/components/schemas/TOTPReport'
          description: SecondFactor reports the state of TOTP for this installation
            and this tenant. It rides the status report rather than a diagnostic method
            of its own so that every surface that already shows status shows it, and
            so that nothing new has to be bound on three surfaces to report a fact.
        servers:
          description: Servers is never nil, so a consumer iterating it need not nil-check.
          items:
            $ref: '#/components/schemas/ServerStatus'
          type:
            - array
            - "null"
        work:
          $ref: '#/components/schemas/Work'
          description: Work counts what the caller's tenant holds.
      type: object
    Surface:
      description: 'Surface names an interactive sign-in path a second factor can
        be required on. It is not Source: Source records how any operation arrived,
        while this names the three paths that mint a session by proving a human is
        present. An API token carries no interactive channel and so appears here not
        at all.'
      enum:
        - web
        - cli
        - ssh
      type: string
    SweepRequest:
      description: SweepRequest bounds one lease sweep.
      properties:
        limit:
          description: Limit caps how many records this pass handles; 0 or omitted
            means 50.
          type: integer
      type: object
    SweepResult:
      description: SweepResult reports how many leases a sweep materialized.
      properties:
        swept:
          description: Swept is how many expired leases were cleared.
          type: integer
      type: object
    SyncResult:
      description: SyncResult reports what an external import did, or would do under
        a dry run.
      properties:
        created:
          additionalProperties:
            type: integer
          description: Created counts the records created, by record kind.
          type:
            - object
            - "null"
        cursor:
          description: Cursor is where the next incremental run resumes.
          type: string
        deleted:
          additionalProperties:
            type: integer
          description: Deleted counts the records deleted, by record kind.
          type: object
        dry_run:
          description: DryRun is true when nothing was written.
          type: boolean
        skipped:
          additionalProperties:
            type: integer
          description: Skipped counts the records left alone, by record kind.
          type:
            - object
            - "null"
        source:
          description: Source is the name of the sync source that ran.
          type: string
        system:
          description: System is the external system the source imports from.
          type: string
        updated:
          additionalProperties:
            type: integer
          description: Updated counts the records updated, by record kind.
          type:
            - object
            - "null"
        warnings:
          description: Warnings lists records the import could not take as they were.
          items:
            type: string
          type: array
      type: object
    SyncSource:
      description: SyncSource records an import source and its cursor.
      properties:
        config:
          additionalProperties:
            type: string
          description: Config is the source's stored non-secret settings, such as
            "url" or "project". It never holds a credential.
          type: object
        created_at:
          description: CreatedAt is when the source was added, RFC 3339.
          format: date-time
          type: string
        cursor:
          description: Cursor is how far the import has read, opaque and owned by
            the system's importer.
          type: string
        id:
          description: ID is the source's unique identifier.
          type: string
        last_run_at:
          description: LastRunAt is when the source was last run, RFC 3339.
          format: date-time
          type:
            - "null"
            - string
        last_status:
          description: 'LastStatus is how the last run went: "running", "ok" or "failed".'
          type: string
        mapping_path:
          description: MappingPath is the stored mapping file, empty when the environment
            names it.
          type: string
        name:
          description: Name identifies the source within its system.
          type: string
        system:
          description: System names the external system imported from.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the source.
          type: string
      type: object
    SyncSourceInput:
      description: SyncSourceInput registers an external import source.
      properties:
        config:
          additionalProperties: {}
          description: 'Config holds the source''s non-secret settings, stored and
            preferred over TIX_SYNC_<SOURCE>_* at run time: "file" and "page_size"
            for generic, "url", "project", "query" and "page_size" for jira and openproject.
            A credential key or any other key is refused. Updating replaces them whole.'
          type: object
        id:
          description: ID names the source to update; empty registers a new one.
          type: string
        mapping_path:
          description: MappingPath is the mapping file, stored and preferred over
            TIX_SYNC_<SOURCE>_MAPPING at run time.
          type: string
        name:
          description: Name labels the source. Required.
          type: string
        system:
          description: 'System is the external system: "generic", "jira" or "openproject".'
          type: string
      type: object
    TOTPChallenge:
      description: TOTPChallenge is the second step of a sign-in. Ticket names the
        first step that was already passed and is presented again with the code; it
        proves the password was accepted and carries no authority of its own.
      properties:
        enrolment:
          $ref: '#/components/schemas/TOTPEnrolment'
          description: Enrolment is set only for ChallengeEnrol.
        kind:
          $ref: '#/components/schemas/TOTPChallengeKind'
          description: Kind says whether a code is asked for, enrolment must happen
            first, or a new password must be chosen.
        ticket:
          description: Ticket is presented with the code in the next step; it expires
            after five minutes. Empty for a password change.
          type: string
      type: object
    TOTPChallengeKind:
      description: TOTPChallengeKind says what a sign-in still needs before a session
        exists.
      enum:
        - code
        - enrol
        - password_change
      type: string
    TOTPCodeRequest:
      description: TOTPCodeRequest carries the code proving possession of an authenticator.
      properties:
        code:
          description: Code is the current code from the authenticator, or a recovery
            code where one is accepted.
          type: string
      type: object
    TOTPEnrolment:
      description: 'TOTPEnrolment is what a started enrolment hands back: the secret
        to put in an authenticator, in both the forms a person might use. It takes
        effect only once a code produced from it is confirmed.'
      properties:
        account:
          description: Account is the label the authenticator shows beside the code.
          type: string
        issuer:
          description: Issuer is the name the authenticator files the entry under,
            the tenant's name or "tix".
          type: string
        secret:
          description: Secret is the base32 shared secret, for typing into an authenticator.
          type: string
        uri:
          description: URI is the otpauth:// URI carrying the secret, for a QR code.
          type: string
      type: object
    TOTPRecoveryCodes:
      description: TOTPRecoveryCodes carries codes the caller must show exactly once.
        They are stored hashed, so nothing can produce them again.
      properties:
        codes:
          description: Codes are the single-use recovery codes, shown this once.
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    TOTPReport:
      description: TOTPReport is what diagnostics say about the second factor. It
        names no user and carries no secret.
      properties:
        admins:
          description: Admins is how many members of the tenant hold the admin role.
          type: integer
        enrolled_admins:
          description: EnrolledAdmins is how many of those admins hold a confirmed
            second factor.
          type: integer
        enrolments:
          description: Enrolments counts confirmed enrolments across the installation,
            because the key that opens them is installation-wide and so is the consequence
            of losing it.
          type: integer
        key_configured:
          description: KeyConfigured reports whether a secret-sealing key is set.
            Without one enrolment is refused outright rather than falling back to
            plaintext.
          type: boolean
        require_cli:
          description: RequireCLI is true when the tenant requires a second factor
            for command line sign-in.
          type: boolean
        require_ssh:
          description: RequireSSH is true when the tenant requires a second factor
            over SSH.
          type: boolean
        require_web:
          description: RequireWeb is true when the tenant requires a second factor
            for web sign-in.
          type: boolean
        tenant_key:
          description: TenantKey is the key of the tenant the rest of the report covers.
          type: string
        unrecoverable:
          description: 'Unrecoverable is enrolments present with no key: every one
            of them is undecryptable until an administrator clears it and the user
            enrols again.'
          type: boolean
      type: object
    TOTPStatus:
      description: TOTPStatus reports a user's enrolment without disclosing anything
        that could produce a code.
      properties:
        confirmed_at:
          description: ConfirmedAt is when the enrolment was confirmed, RFC 3339,
            absent if never.
          format: date-time
          type:
            - "null"
            - string
        enrolled:
          description: Enrolled is true when the caller holds a confirmed second factor.
          type: boolean
        pending:
          description: Pending is an enrolment that was begun and never confirmed.
            It grants nothing; it is reported so a user who abandoned enrolment is
            told why their authenticator entry does not work.
          type: boolean
        recovery_codes_left:
          description: RecoveryCodesLeft is how many unused recovery codes the caller
            holds.
          type: integer
        required_cli:
          description: RequiredCLI is true when the tenant requires a second factor
            for command line sign-in.
          type: boolean
        required_ssh:
          description: RequiredSSH is true when the tenant requires a second factor
            over SSH.
          type: boolean
        required_web:
          description: RequiredWeb is true when the tenant requires a second factor
            for web sign-in.
          type: boolean
        verification_lock_end:
          description: VerificationLockEnd is when the lock lifts, RFC 3339, set only
            while locked.
          format: date-time
          type:
            - "null"
            - string
        verification_locked:
          description: VerificationLocked is true while too many wrong codes have
            locked verification.
          type: boolean
      type: object
    Tag:
      description: Tag is a free-form tag.
      properties:
        color:
          description: Color is the tag's display colour. Empty when none was chosen.
          type: string
        id:
          description: ID is the tag's unique identifier.
          type: string
        name:
          description: Name is the tag as written on tasks.
          type: string
        project_id:
          description: ProjectID limits the tag to one project when set. Empty for
            a tenant-wide tag.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the tag.
          type: string
      type: object
    TagRequest:
      description: TagRequest carries a tag name.
      properties:
        name:
          description: Name is the tag to attach; it is created on first use.
          type: string
      type: object
    Task:
      description: Task is the central record.
      properties:
        assignee_actor_id:
          description: AssigneeActorID is the actor the task is assigned to. Empty
            when unassigned.
          type: string
        blocked:
          description: Blocked reports that at least one task this one depends on
            is neither completed nor deleted.
          type: boolean
        body:
          description: Body is the task's description, in Markdown. Lines of the form
            "- [ ] item" form its checklist.
          type: string
        checklist:
          $ref: '#/components/schemas/Checklist'
          description: Checklist counts the checklist items of the description. A
            read sets it from the body, so it is absent from audit snapshots and exports,
            and nil when the description has no items.
        claim_count:
          description: ClaimCount is how many times the task has been claimed.
          type: integer
        claimed_at:
          description: ClaimedAt is when the current claim was taken, RFC 3339.
          format: date-time
          type:
            - "null"
            - string
        claimed_by_actor_id:
          description: ClaimedByActorID is the actor holding the current claim. A
            claim whose LeaseExpiresAt has passed holds nothing.
          type: string
        completed_at:
          description: CompletedAt is when the task reached a terminal state, RFC
            3339. Cleared when it leaves one.
          format: date-time
          type:
            - "null"
            - string
        copied_from_id:
          description: CopiedFromID names the task this one was copied from, when
            the copy was asked to keep that link.
          type: string
        created_at:
          description: CreatedAt is when the task was created, RFC 3339.
          format: date-time
          type: string
        creator_actor_id:
          description: CreatorActorID is the actor who created the task.
          type: string
        custom_fields:
          additionalProperties: {}
          description: CustomFields holds the values of the project's custom fields,
            keyed by field key.
          type: object
        deleted_at:
          description: DeletedAt is when the task was moved to the trash, RFC 3339.
            Absent on a live task.
          format: date-time
          type:
            - "null"
            - string
        depends_on:
          description: DependsOn lists the IDs of the tasks this one waits for.
          items:
            type: string
          type: array
        due_at:
          description: DueAt is when the task is due, RFC 3339. Absent when it has
            no due date.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the task's unique identifier.
          type: string
        lease:
          description: Lease is how long a claim on this task holds when the claim
            names no ttl of its own, as a duration such as "4h". Zero or absent falls
            through to the project, workflow and tenant.
          type: string
        lease_expired_at:
          description: LeaseExpiredAt is when the last claim on the task ran out rather
            than being released, RFC 3339. The sweeper writes it as it clears the
            lease, so the fact that a holder dropped the task survives the clearing.
          format: date-time
          type:
            - "null"
            - string
        lease_expired_by_actor_id:
          description: LeaseExpiredByActorID is the actor whose claim ran out at LeaseExpiredAt.
          type: string
        lease_expires_at:
          description: LeaseExpiresAt is when the current claim runs out unless renewed,
            RFC 3339.
          format: date-time
          type:
            - "null"
            - string
        parent_id:
          description: ParentID is the ID of the task this one is a subtask of. Empty
            for a top- level task.
          type: string
        priority:
          description: Priority orders tasks in a queue.
          type: integer
        project_id:
          description: ProjectID is the project the task belongs to.
          type: string
        recurrence:
          description: Recurrence is the canonical repeat rule, empty for a task that
            does not repeat. Finishing a repeating task spawns its next occurrence.
          type: string
        recurrence_next_id:
          description: RecurrenceNextID is the ID of the occurrence this task spawned
            when it was finished. Once set, the task never spawns again.
          type: string
        ref:
          description: Ref is the human reference, the project key and Seq such as
            "INFRA-42". Anywhere a task is named, Ref or ID is accepted.
          type: string
        seq:
          description: Seq is the task's number within its project, the numeric part
            of Ref.
          format: int64
          type: integer
        snoozed_by_actor_id:
          description: SnoozedByActorID is the actor who set the snooze.
          type: string
        snoozed_until:
          description: SnoozedUntil hides the task from default listings while it
            is in the future, RFC 3339. A past value is not a snooze.
          format: date-time
          type:
            - "null"
            - string
        starred:
          description: Starred is the reading actor's own star, never anybody else's.
            Only a read that knows its reader sets it, so it is omitted rather than
            false wherever nobody asked, which keeps it out of audit snapshots and
            exports.
          type: boolean
        started_at:
          description: StartedAt is when the task first left its workflow's initial
            state, RFC 3339.
          format: date-time
          type:
            - "null"
            - string
        status:
          description: Status is the key of the task's current workflow state.
          type: string
        tags:
          description: Tags are the names of the tags on the task.
          items:
            type: string
          type: array
        tenant_id:
          description: TenantID is the tenant that owns the task.
          type: string
        title:
          description: Title is the task's one-line summary.
          type: string
        updated_at:
          description: UpdatedAt is when the task was last changed, RFC 3339.
          format: date-time
          type: string
        version:
          description: Version increases by one on every change. Pass it back on an
            update to have a stale write refused with a conflict.
          type: integer
      type: object
    TaskTemplate:
      description: 'TaskTemplate is a named shape of a task that is not itself work:
        it never appears where tasks do, and using it creates tasks.'
      properties:
        created_at:
          description: CreatedAt is when the template was saved, RFC 3339.
          format: date-time
          type: string
        creator_actor_id:
          description: CreatorActorID is the actor who saved the template.
          type: string
        due_in:
          description: DueIn is how far from a use its task falls due, as a duration
            such as "3d", zero for no due date.
          type: string
        id:
          description: ID identifies the template.
          type: string
        name:
          description: Name labels the template, unique in the tenant ignoring case.
          type: string
        project_id:
          description: ProjectID is the project the template belongs to, empty for
            a template the whole tenant shares.
          type: string
        project_key:
          description: ProjectKey is that project's key, for display.
          type: string
        task:
          $ref: '#/components/schemas/TemplateTask'
          description: Task is the task shape a use creates, with its subtasks.
        tenant_id:
          description: TenantID identifies the tenant the template belongs to.
          type: string
        updated_at:
          description: UpdatedAt is when the template last changed, RFC 3339.
          format: date-time
          type: string
        uses:
          description: Uses counts the times the template was used; the N placeholder
            is the count the next use makes.
          type: integer
      type: object
    TemplateTask:
      description: TemplateTask is the part of a task a template keeps, with its subtasks.
      properties:
        body:
          description: Body is the task description, in Markdown.
          type: string
        custom_fields:
          additionalProperties: {}
          description: CustomFields are custom field values keyed by field definition
            key.
          type: object
        lease:
          description: Lease is the claim lease the task carries, as a duration such
            as "4h", zero to inherit.
          type: string
        priority:
          description: Priority orders tasks in a queue.
          type: integer
        recurrence:
          description: Recurrence is the task's repeat rule, empty for none.
          type: string
        subtasks:
          description: Subtasks are the child tasks created under this one, in order.
          items:
            $ref: '#/components/schemas/TemplateTask'
          type: array
        tags:
          description: Tags are the tag names the task gets.
          items:
            type: string
          type: array
        title:
          description: Title is the task title, which may carry the placeholders {date},
            {n} and {project}, filled in on each use.
          type: string
      type: object
    Tenant:
      description: Tenant is the top-level isolation boundary.
      properties:
        created_at:
          description: CreatedAt is when the tenant was created, RFC 3339.
          format: date-time
          type: string
        deleted_at:
          description: DeletedAt is when the tenant was deleted, RFC 3339. Absent
            on a live tenant.
          format: date-time
          type:
            - "null"
            - string
        id:
          description: ID is the tenant's unique identifier.
          type: string
        key:
          description: Key is the tenant's short, unique, human-readable key, used
            to refer to it in place of the ID.
          type: string
        lease_default:
          description: LeaseDefault is how long a claim on this tenant's tasks holds
            when the claim, task, project and workflow name none, as a duration such
            as "4h". Zero or absent defers to the deployment configuration, then the
            built-in default.
          type: string
        lease_max:
          description: LeaseMax caps any lease granted on this tenant's tasks, as
            a duration such as "24h". It can lower the deployment's ceiling but never
            raise it; zero or absent inherits the deployment's.
          type: string
        name:
          description: Name is the tenant's display name.
          type: string
        require_totp_cli:
          description: RequireTOTPCLI requires a second factor when signing in from
            the command line. Defaults to false.
          type: boolean
        require_totp_ssh:
          description: RequireTOTPSSH requires a second factor when opening the board
            over SSH, on top of the key. Defaults to false.
          type: boolean
        require_totp_web:
          description: RequireTOTPWeb requires a second factor when signing in to
            the browser interface. Each surface is set independently and defaults
            to false.
          type: boolean
        theme:
          description: Theme names the palette this tenant presents itself with, on
            every surface. Empty means nobody chose, and the accent is derived from
            the tenant's own identity instead; see ThemeRegistry.Resolve.
          type: string
        time_format:
          description: TimeFormat is the date format this tenant's people read unless
            they chose their own. Empty inherits the deployment's output.time_format.
          type: string
        timezone:
          description: Timezone is the IANA zone this tenant's people read dates in
            unless they chose their own. Empty inherits the deployment's output.timezone.
          type: string
        trash_off:
          description: TrashOff makes deleting a task permanent on this tenant. False,
            the default, keeps deleted tasks in a trash they can be restored from.
          type: boolean
        updated_at:
          description: UpdatedAt is when the tenant was last changed, RFC 3339.
          format: date-time
          type: string
      type: object
    TenantAdminInput:
      description: TenantAdminInput names one first administrator of a new tenant.
      properties:
        display_name:
          description: DisplayName is the name shown for the administrator.
          type: string
        email:
          description: Email is the administrator's sign-in address, lowercased. Required.
          type: string
        handle:
          description: Handle is the administrator's short name in the new tenant,
            lowercased; empty uses the part of the email before the "@".
          type: string
        password:
          description: Password is at least 12 characters. Empty generates a random
            one, which the response carries once in initial_credentials and nothing
            stores.
          type: string
      type: object
    TenantUser:
      description: TenantUser is a user of some tenant together with their role there.
      properties:
        created_at:
          description: CreatedAt is when the user was created, RFC 3339.
          format: date-time
          type: string
        disabled_at:
          description: DisabledAt is when the user was disabled, RFC 3339. A disabled
            user cannot sign in; absent on an active user.
          format: date-time
          type:
            - "null"
            - string
        display_name:
          description: DisplayName is the name shown for the user. Empty means the
            email is shown instead.
          type: string
        email:
          description: Email is the user's sign-in address, unique within the installation.
          type: string
        global_admin:
          description: GlobalAdmin reports whether the user is a global admin, who
            administers every tenant of the installation rather than only their own.
          type: boolean
        id:
          description: ID is the user's actor identifier.
          type: string
        require_password_change:
          description: RequirePasswordChange reports whether the next password sign-in
            must choose a new password before a session is minted.
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
          description: Role is the user's role in that tenant; empty when they hold
            no membership there.
        sso_provider:
          description: SSOProvider names the single sign-on provider that vouches
            for the user. Empty for a password user.
          type: string
        sso_subject:
          description: SSOSubject is the user's subject identifier at SSOProvider.
          type: string
        totp_enrolled:
          description: 'TOTPEnrolled reports whether this user holds a confirmed second
            factor. It is state, not a credential: nothing here can produce a code,
            and it is what lets an administrative listing say who holds one rather
            than only offering to clear it. Set by the listings and by GetUser; a
            user written back from one carries it and nothing reads it as an input.'
          type: boolean
        updated_at:
          description: UpdatedAt is when the user was last changed, RFC 3339.
          format: date-time
          type: string
      type: object
    Transition:
      description: Transition is one permitted edge of a workflow's state machine.
      properties:
        from:
          description: From is the state key the move starts from.
          type: string
        requires_comment:
          description: RequiresComment refuses the move unless it carries a comment.
          type: boolean
        requires_scope:
          $ref: '#/components/schemas/Scope'
          description: RequiresScope is a scope the actor must hold to make this move.
            Empty means no extra scope.
        to:
          description: To is the state key the move ends in.
          type: string
      type: object
    TransitionInput:
      description: TransitionInput moves a task to a new status.
      properties:
        comment:
          description: Comment is added to the task as a comment; required when the
            transition demands one.
          type: string
        custom_fields:
          additionalProperties: {}
          description: CustomFields merges values over the stored ones by field key;
            a null value clears that field.
          type: object
        lease_token:
          description: LeaseToken is the claim's token, required while the task is
            claimed.
          type: string
        to:
          description: To is the target status, which the workflow must allow from
            the current one. Required.
          type: string
        version:
          description: Version is the task version the caller last read. When set
            and stale the move is refused as a conflict; 0 skips the check.
          type: integer
      type: object
    TrashStatus:
      description: TrashStatus says whether a tenant keeps deleted tasks, and how
        many it holds. Held counts the trash even while it is off, because turning
        it off keeps what is already there rather than destroying it.
      properties:
        enabled:
          description: Enabled reports whether deleted tasks go to the trash rather
            than being removed for good.
          type: boolean
        held:
          description: Held is how many deleted tasks the trash holds, counted even
            while the trash is off.
          type: integer
      type: object
    UpdateProjectInput:
      description: UpdateProjectInput changes a project. A pointer to an empty colour
        clears it. Naming any icon field replaces the whole icon with that kind, and
        an empty one clears it. A new key renames every task reference and keeps the
        old key as an alias of the project.
      properties:
        color:
          description: Color is a palette colour name or "#rrggbb"; empty clears it
            and omitted leaves it.
          type:
            - "null"
            - string
        description:
          description: Description replaces the description; omitted leaves it.
          type:
            - "null"
            - string
        icon:
          description: Icon sets a text icon, replacing any icon; empty clears the
            icon and omitted leaves it.
          type:
            - "null"
            - string
        icon_file:
          $ref: '#/components/schemas/ProjectIconFile'
          description: IconFile sets an uploaded image icon, replacing any icon; omitted
            leaves it.
        icon_name:
          description: IconName sets a built-in icon, replacing any icon; empty clears
            the icon and omitted leaves it.
          type:
            - "null"
            - string
        key:
          description: Key renames the project's key, rewriting every task reference
            and keeping the old key as an alias; omitted leaves it.
          type:
            - "null"
            - string
        lease_default:
          description: LeaseDefault is the lease a claim on this project's tasks gets
            when the claim and task name none, a duration such as "30m"; zero inherits
            the tenant's again and omitted leaves it.
          type:
            - "null"
            - string
        lease_max:
          description: LeaseMax caps a lease on this project's tasks below the tenant's
            ceiling, a duration such as "4h"; zero inherits the tenant's again and
            omitted leaves it.
          type:
            - "null"
            - string
        name:
          description: Name renames the project; omitted leaves it.
          type:
            - "null"
            - string
        workflow_key:
          description: WorkflowKey switches the project to another workflow, refused
            while a task sits in a status the new workflow lacks; omitted leaves it.
          type:
            - "null"
            - string
      type: object
    UpdateTaskInput:
      description: UpdateTaskInput changes a task.
      properties:
        assignee_actor_id:
          description: AssigneeActorID assigns an actor by identifier or handle; empty
            unassigns and omitted leaves it.
          type:
            - "null"
            - string
        body:
          description: Body replaces the Markdown description; omitted leaves it.
          type:
            - "null"
            - string
        custom_fields:
          additionalProperties: {}
          description: CustomFields merges values over the stored ones by field key;
            a null value clears that field.
          type: object
        due_at:
          description: DueAt sets the due time, an RFC 3339 timestamp; null clears
            it and omitted leaves it.
          format: date-time
          type:
            - "null"
            - string
        lease:
          description: Lease sets how long a claim on the task holds; a pointer to
            zero clears it back to the project's.
          type:
            - "null"
            - string
        parent_ref:
          description: ParentRef moves the task under another task, refusing a cycle;
            empty detaches it and omitted leaves it.
          type:
            - "null"
            - string
        priority:
          description: Priority orders tasks in a queue.
          type:
            - "null"
            - integer
        recurrence:
          description: Recurrence replaces the repeat rule; a pointer to the empty
            string removes it and nil leaves it alone.
          type:
            - "null"
            - string
        tags:
          description: Tags replaces the task's whole tag set; an empty list removes
            every tag and omitted leaves them.
          items:
            type: string
          type:
            - "null"
            - array
        title:
          description: Title replaces the title, at most 500 characters; omitted leaves
            it.
          type:
            - "null"
            - string
        version:
          description: Version is the task version the caller last read. When set
            and stale the update is refused as a conflict; 0 skips the check.
          type: integer
      type: object
    UpdateTemplateInput:
      description: UpdateTemplateInput changes a template. A nil field is left as
        it is.
      properties:
        body:
          description: Body replaces the root task's Markdown description.
          type:
            - "null"
            - string
        custom_fields:
          additionalProperties: {}
          description: CustomFields sets the named fields; a null value removes one.
          type: object
        due_in:
          description: DueIn replaces the due offset, a duration such as "3d"; zero
            removes it.
          type:
            - "null"
            - string
        name:
          description: Name renames the template, under the same rules as on saving.
          type:
            - "null"
            - string
        priority:
          description: Priority orders tasks in a queue.
          type:
            - "null"
            - integer
        project_ref:
          description: ProjectRef moves the template to a project; a pointer to the
            empty string makes it tenant-wide.
          type:
            - "null"
            - string
        recurrence:
          description: Recurrence replaces the repeat rule; a pointer to the empty
            string removes it.
          type:
            - "null"
            - string
        tags:
          description: Tags replaces the root task's tag names.
          items:
            type: string
          type:
            - "null"
            - array
        title:
          description: Title replaces the root task's title, placeholders allowed.
          type:
            - "null"
            - string
      type: object
    UpdateTenantInput:
      description: UpdateTenantInput changes a tenant.
      properties:
        lease_default:
          description: LeaseDefault is the lease a claim on this tenant gets when
            nothing more specific names one, a duration such as "30m". Zero clears
            it back to the deployment configuration and omitted leaves it alone. A
            default longer than the maximum the tenant would hold, sent or stored,
            is refused.
          type:
            - "null"
            - string
        lease_max:
          description: LeaseMax is the longest lease a claim on this tenant may hold,
            a duration such as "4h". Zero clears it back to the deployment configuration
            and omitted leaves it alone.
          type:
            - "null"
            - string
        name:
          description: Name renames the tenant; it must not be blank, and omitted
            leaves it.
          type:
            - "null"
            - string
        require_totp_cli:
          description: RequireTOTPCLI turns the second-factor requirement for command
            line sign-in on or off; omitted leaves it alone.
          type:
            - "null"
            - boolean
        require_totp_ssh:
          description: RequireTOTPSSH turns the second-factor requirement for SSH
            sign-in on or off; omitted leaves it alone.
          type:
            - "null"
            - boolean
        require_totp_web:
          description: 'RequireTOTPWeb turns the second-factor requirement for browser
            sign-in on or off; omitted leaves it alone. The requirement is a property
            of the tenant rather than a command of its own, so there is one place
            to get its authorization right. Turning one on cannot lock the tenant
            out: a user subject to it who holds no enrolment is taken through enrolment
            at sign-in rather than refused.'
          type:
            - "null"
            - boolean
        theme:
          description: Theme names the palette this tenant presents itself with. A
            pointer to the empty string clears it, which returns the tenant to the
            accent derived from its own identity; nil leaves it alone.
          type:
            - "null"
            - string
        time_format:
          description: 'TimeFormat is the date format this tenant''s people read unless
            they chose their own: iso, rfc3339, short, long, dotted, dayfirst, us
            or relative. "" returns it to the deployment default; nil leaves it.'
          type:
            - "null"
            - string
        timezone:
          description: Timezone is the IANA zone this tenant's people read dates in
            unless they chose their own. "" returns it to the deployment default;
            nil leaves it.
          type:
            - "null"
            - string
        trash_off:
          description: TrashOff turns the trash off (true) or back on (false); nil
            leaves it alone. Turning it off keeps the tasks already in the trash.
          type:
            - "null"
            - boolean
      type: object
    UpdateUserInput:
      description: UpdateUserInput changes a user.
      properties:
        disabled:
          description: Disabled true disables the user, ending their sessions and
            revoking their tokens at once; false enables them; omitted leaves it.
          type:
            - "null"
            - boolean
        display_name:
          description: DisplayName replaces the display name; omitted leaves it.
          type:
            - "null"
            - string
        password:
          description: Password sets a new password; omitted leaves it.
          type:
            - "null"
            - string
        require_password_change:
          description: RequirePasswordChange true makes the next password sign-in
            choose a new password first; false lifts that; omitted leaves it.
          type:
            - "null"
            - boolean
        role:
          $ref: '#/components/schemas/Role'
          description: Role changes the user's role in this tenant; omitted leaves
            it.
      type: object
    UseTemplateInput:
      description: UseTemplateInput says where a task made from a template goes. An
        empty ProjectRef uses the template's project, an empty Title the template's,
        and a nil DueIn the template's offset; a zero DueIn sets no due date.
      properties:
        due_in:
          description: DueIn overrides the due offset, a duration such as "3d"; zero
            sets no due date and omitted keeps the template's.
          type:
            - "null"
            - string
        project_ref:
          description: ProjectRef is the project to create the task in, by key or
            id; empty uses the template's project.
          type: string
        title:
          description: Title overrides the template's title, placeholders allowed.
          type: string
      type: object
    User:
      description: User is a credentialed human.
      properties:
        created_at:
          description: CreatedAt is when the user was created, RFC 3339.
          format: date-time
          type: string
        disabled_at:
          description: DisabledAt is when the user was disabled, RFC 3339. A disabled
            user cannot sign in; absent on an active user.
          format: date-time
          type:
            - "null"
            - string
        display_name:
          description: DisplayName is the name shown for the user. Empty means the
            email is shown instead.
          type: string
        email:
          description: Email is the user's sign-in address, unique within the installation.
          type: string
        global_admin:
          description: GlobalAdmin reports whether the user is a global admin, who
            administers every tenant of the installation rather than only their own.
          type: boolean
        id:
          description: ID is the user's actor identifier.
          type: string
        require_password_change:
          description: RequirePasswordChange reports whether the next password sign-in
            must choose a new password before a session is minted.
          type: boolean
        sso_provider:
          description: SSOProvider names the single sign-on provider that vouches
            for the user. Empty for a password user.
          type: string
        sso_subject:
          description: SSOSubject is the user's subject identifier at SSOProvider.
          type: string
        totp_enrolled:
          description: 'TOTPEnrolled reports whether this user holds a confirmed second
            factor. It is state, not a credential: nothing here can produce a code,
            and it is what lets an administrative listing say who holds one rather
            than only offering to clear it. Set by the listings and by GetUser; a
            user written back from one carries it and nothing reads it as an input.'
          type: boolean
        updated_at:
          description: UpdatedAt is when the user was last changed, RFC 3339.
          format: date-time
          type: string
      type: object
    Via:
      description: 'Via is the access channel of one change and what identified the
        caller on it. It is set once by the entry point the request arrived through
        and never read from a request body. It holds no secret: a token is named by
        its ID and name, a browser session by an opaque reference, never by the value
        presented.'
      properties:
        client_addr:
          description: ClientAddr is the client address, as the trusted proxies report
            it.
          type: string
        host:
          description: Host is the machine a local command ran on, when cli.record_host
            is on.
          type: string
        job:
          description: Job names the background work a system change came from, such
            as lease-sweep or housekeeping.
          type: string
        key_fingerprint:
          description: KeyFingerprint is the SHA256 fingerprint of the SSH key a terminal
            session signed in with.
          type: string
        kind:
          description: 'ViaKind names the access channel a change arrived through.
            It is finer than Source: Source says which surface, ViaKind says how the
            caller reached it.'
          type: string
        origin:
          description: 'ViaKind names the access channel a change arrived through.
            It is finer than Source: Source says which surface, ViaKind says how the
            caller reached it.'
          type: string
        os_user:
          description: OSUser is the operating-system user a local command ran as,
            when cli.record_host is on.
          type: string
        session:
          description: Session is an opaque reference to the browser session, a digest
            that is neither the cookie nor the hash a lookup accepts.
          type: string
        token_id:
          description: TokenID is the API token the caller authenticated with.
          type: string
        token_name:
          description: TokenName is that token's name when the change was made.
          type: string
        user_agent:
          description: UserAgent is the HTTP user agent, truncated.
          type: string
      type: object
    WakeResult:
      description: WakeResult reports how many snoozes a wake pass cleared.
      properties:
        woken:
          description: Woken is how many expired snoozes were cleared.
          type: integer
      type: object
    WebhookDelivery:
      description: WebhookDelivery tracks one event's delivery to one endpoint.
      properties:
        attempts:
          description: Attempts is how many times delivery has been tried.
          type: integer
        created_at:
          description: CreatedAt is when the delivery was queued, RFC 3339.
          format: date-time
          type: string
        endpoint_id:
          description: EndpointID is the ID of the endpoint delivered to.
          type: string
        event_seq:
          description: EventSeq is the Seq of the event delivered.
          format: int64
          type: integer
        id:
          description: ID is the delivery's unique identifier, used to redeliver it.
          type: string
        last_error:
          description: LastError describes why the last attempt failed. Empty after
            a success.
          type: string
        last_status_code:
          description: LastStatusCode is the HTTP status the endpoint answered the
            last attempt with. Absent when no response arrived.
          type: integer
        next_attempt_at:
          description: NextAttemptAt is when the next attempt is due, RFC 3339.
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
          description: Status is where the delivery stands.
        tenant_id:
          description: TenantID is the tenant that owns the delivery.
          type: string
      type: object
    WebhookEndpoint:
      description: WebhookEndpoint is a registered delivery target.
      properties:
        active:
          description: Active turns deliveries on. An inactive endpoint receives nothing.
          type: boolean
        created_at:
          description: CreatedAt is when the endpoint was registered, RFC 3339.
          format: date-time
          type: string
        event_types:
          description: EventTypes are the event types delivered, exact or with a trailing
            "*" such as "task.*". Empty delivers every event.
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: ID is the endpoint's unique identifier.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the endpoint.
          type: string
        url:
          description: URL is where deliveries are POSTed.
          type: string
      type: object
    WebhookInput:
      description: WebhookInput registers or updates a delivery endpoint.
      properties:
        active:
          description: Active turns delivery on; an inactive endpoint receives nothing.
          type: boolean
        event_types:
          description: EventTypes filters the events delivered; a pattern may end
            in "*". Empty delivers every event.
          items:
            type: string
          type: array
        id:
          description: ID names the endpoint to update; empty registers a new one.
          type: string
        secret:
          description: Secret signs each delivery. Empty keeps an existing endpoint's
            secret, or generates one that the response returns once.
          type: string
        url:
          description: URL receives the deliveries. It must use https unless it is
            a loopback address. Required.
          type: string
      type: object
    Work:
      description: Work counts what the caller's own tenant holds, plus the number
        of tenants the caller can see. Tenants is deliberately what this reader could
        already list rather than what the installation holds. An installation-wide
        count would tell the administrator of one tenant that six others exist, which
        nothing else in the product tells them.
      properties:
        claimed:
          description: Claimed is how many tasks hold an unexpired lease.
          type: integer
        leases_expired_unswept:
          description: LeasesExpiredUnswept are claims past their expiry that the
            sweeper has not yet cleared. They read as unclaimed already; the figure
            says how much the sweeper is behind.
          type: integer
        projects:
          description: Projects is how many projects the tenant holds.
          type: integer
        tasks:
          description: Tasks is how many tasks the tenant holds, trashed ones excluded.
          type: integer
        tenants:
          description: Tenants is how many tenants the caller can see.
          type: integer
        webhooks_failed:
          description: WebhooksFailed is how many webhook deliveries have failed for
            good.
          type: integer
        webhooks_pending:
          description: WebhooksPending is how many webhook deliveries await a first
            or next attempt.
          type: integer
      type: object
    Workflow:
      description: Workflow is a named state machine owned by a tenant and assigned
        to projects.
      properties:
        builtin:
          description: Builtin marks a workflow shipped with tix. It can be changed
            but not deleted.
          type: boolean
        created_at:
          description: CreatedAt is when the workflow was created, RFC 3339.
          format: date-time
          type: string
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
          description: Definition is the state machine itself.
        id:
          description: ID is the workflow's unique identifier.
          type: string
        key:
          description: Key is the workflow's unique key within the tenant.
          type: string
        name:
          description: Name is the workflow's display name.
          type: string
        tenant_id:
          description: TenantID is the tenant that owns the workflow.
          type: string
        updated_at:
          description: UpdatedAt is when the workflow was last changed, RFC 3339.
          format: date-time
          type: string
      type: object
    WorkflowDefinition:
      description: WorkflowDefinition is the state machine, stored as one JSON document.
      properties:
        default_lease:
          description: DefaultLease is how long a claim on a task under this workflow
            holds when the claim, task and project name none, as a duration such as
            "4h". Zero or absent defers to the tenant.
          type: string
        initial:
          description: Initial is the key of the state a new task starts in.
          type: string
        states:
          description: States are the workflow's states.
          items:
            $ref: '#/components/schemas/State'
          type:
            - array
            - "null"
        transitions:
          description: Transitions are the permitted moves between states. A move
            not listed is refused.
          items:
            $ref: '#/components/schemas/Transition'
          type:
            - array
            - "null"
      type: object
    WorkflowInput:
      description: WorkflowInput defines or redefines a workflow.
      properties:
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
          description: Definition is the states and transitions. It needs an initial
            state that it defines and at least one terminal state.
        key:
          description: Key identifies the workflow; an existing key is redefined.
            Letters, digits, hyphens and underscores, starting with a letter. Required.
          type: string
        migrate:
          additionalProperties:
            type: string
          description: Migrate maps each removed state that still holds tasks to a
            state of the new definition; a redefinition stranding tasks without one
            is a conflict.
          type: object
        name:
          description: Name is the workflow's display name.
          type: string
      type: object
  securitySchemes:
    bearer:
      description: 'An API token, `Authorization: Bearer TOKEN`. Each operation lists
        the scope it needs; an empty list needs an authenticated actor and nothing
        more. The scopes are `task:read`, `task:write`, `task:transition`, `task:claim`,
        `task:delete`, `task:reclaim`, `project:read`, `project:write`, `workflow:read`,
        `workflow:write`, `comment:write`, `artifact:write`, `event:subscribe`, `user:admin`,
        `totp:admin`, `token:admin`, `webhook:admin`, `tenant:admin`, `sync:admin`,
        `audit:read`, `export`, `import`, `global:admin`.'
      scheme: bearer
      type: http
    session:
      description: The browser session cookie `POST /api/v1/auth/login` sets. Each
        operation lists the scope it needs; an empty list needs an authenticated actor
        and nothing more. The scopes are `task:read`, `task:write`, `task:transition`,
        `task:claim`, `task:delete`, `task:reclaim`, `project:read`, `project:write`,
        `workflow:read`, `workflow:write`, `comment:write`, `artifact:write`, `event:subscribe`,
        `user:admin`, `totp:admin`, `token:admin`, `webhook:admin`, `tenant:admin`,
        `sync:admin`, `audit:read`, `export`, `import`, `global:admin`.
      in: cookie
      name: tix_session
      type: apiKey
