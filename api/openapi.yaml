  /api/v1/auth/login:
    post:
      description: |-
        Login is one step of an interactive sign-in. It answers with a session when nothing further is needed, and with a challenge when the tenant requires a second factor on the surface the caller named. The second call presents the challenge's ticket and the code. It is two steps rather than one call taking a code beside the password, because a surface that could pass both at once is a surface that could take the code from a flag or an environment variable, which puts a live second factor in shell history and in the process table.

        Command line: `tix login`.

        Specified in [`http-api`](openspec/specs/http-api/spec.md).
      operationId: session.login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: LoginResult is either a session or the challenge standing between
            the caller and one. Exactly one of the two is set.
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
