  /api/v1/tasks:
    get:
      description: |-
        ListTasks lists tasks matching the filter, one keyset-paginated page at a time, with the cursor for the next page. Snoozed tasks are left out unless the filter asks for them.

        Command line: `tix task ls`.
      operationId: task.list
      parameters:
        - description: 'Limit is the most items one page holds: default 50, at most
            500.'
          in: query
          name: limit
          schema:
            type: integer
        - description: Cursor is the next_cursor of the previous page, to read the
            page after it. Leave it out for the first page.
          in: query
          name: cursor
          schema:
            type: string
        - description: Sort names the field the listing is ordered by. Each listing
            has its own default and refuses a field it cannot sort by.
          in: query
          name: sort
          schema:
            type: string
        - description: Direction is asc or desc, default asc.
          in: query
          name: direction
          schema:
            enum:
              - asc
              - desc
            type: string
        - description: Project keeps tasks in a project, named by key, not case sensitive;
            repeat it for several. An unknown key is an error.
          in: query
          name: project
          schema:
            items:
              type: string
            type: array
        - description: ProjectID keeps tasks in a project, named by ID; repeat it
            for several.
          in: query
          name: project_id
          schema:
            items:
              type: string
            type: array
        - description: Status keeps tasks in a workflow state, named by key, not case
            sensitive; repeat it for several. A state no workflow declares is an error.
          in: query
          name: status
          schema:
            items:
              type: string
            type: array
        - description: Tag keeps tasks carrying a tag; repeat it for several, and
            a task must carry every one.
          in: query
          name: tag
          schema:
            items:
              type: string
            type: array
        - description: Assignee keeps tasks assigned to an actor, named by ID, handle
            or me; repeat it for several.
          in: query
          name: assignee
          schema:
            items:
              type: string
            type: array
        - description: Creator keeps tasks created by an actor, named by ID, handle
            or me; repeat it for several.
          in: query
          name: creator
          schema:
            items:
              type: string
            type: array
        - description: ClaimedBy keeps tasks claimed by an actor, named by ID, handle
            or me; repeat it for several.
          in: query
          name: claimed_by
          schema:
            items:
              type: string
            type: array
        - description: ParentID keeps the direct subtasks of one task, named by reference
            such as INFRA-42 or by ID. It cannot be combined with root_only.
          in: query
          name: parent_id
          schema:
            type: string
        - description: 'Q is a free text search over title and body: a substring match
            on SQLite, a full text match on PostgreSQL.'
          in: query
          name: q
          schema:
            type: string
        - description: RootOnly is true to keep only tasks without a parent.
          in: query
          name: root_only
          schema:
            type: boolean
        - description: IncludeDeleted is true to list tasks in the trash alongside
            live ones.
          in: query
          name: include_deleted
          schema:
            type: boolean
        - description: Claimed is true for tasks under a live claim, false for the
            rest, and absent for either.
          in: query
          name: claimed
          schema:
            type: string
        - description: Starred is true for tasks the caller starred, false for the
            rest, and absent for either.
          in: query
          name: starred
          schema:
            type: string
        - description: Blocked is true for tasks waiting on an unfinished dependency,
            false for the rest, and absent for either.
          in: query
          name: blocked
          schema:
            type: string
        - description: Recurring is true for tasks with a repeat rule, false for the
            rest, and absent for either.
          in: query
          name: recurring
          schema:
            type: string
        - description: Checklist is true for tasks whose body holds a checklist, false
            for the rest, and absent for either.
          in: query
          name: checklist
          schema:
            type: string
        - description: ChecklistOpen is true for tasks with an unticked checklist
            item, false for the rest, and absent for either.
          in: query
          name: checklist_open
          schema:
            type: string
        - description: Trashed is true for the trash alone, false for live tasks alone,
            and absent to follow include_deleted.
          in: query
          name: trashed
          schema:
            type: string
        - description: Snoozed is true for snoozed tasks alone, false for the rest,
            or any for both. Absent leaves snoozed tasks out.
          in: query
          name: snoozed
          schema:
            type: string
        - description: Priority keeps tasks of a priority from 1, the highest, to
            5, the lowest; repeat it for several.
          in: query
          name: priority
          schema:
            items:
              type: integer
            type: array
        - description: NotProject leaves out tasks in a project, named by key; repeat
            it for several.
          in: query
          name: not_project
          schema:
            items:
              type: string
            type: array
        - description: NotStatus leaves out tasks in a workflow state; repeat it for
            several.
          in: query
          name: not_status
          schema:
            items:
              type: string
            type: array
        - description: NotTag leaves out tasks carrying a tag; repeat it for several.
          in: query
          name: not_tag
          schema:
            items:
              type: string
            type: array
        - description: NotAssignee leaves out tasks assigned to an actor, named by
            ID, handle or me; repeat it for several.
          in: query
          name: not_assignee
          schema:
            items:
              type: string
            type: array
        - description: NotCreator leaves out tasks created by an actor, named by ID,
            handle or me; repeat it for several.
          in: query
          name: not_creator
          schema:
            items:
              type: string
            type: array
        - description: NotClaimedBy leaves out tasks claimed by an actor, named by
            ID, handle or me; repeat it for several.
          in: query
          name: not_claimed_by
          schema:
            items:
              type: string
            type: array
        - description: NotPriority leaves out tasks of a priority from 1 to 5; repeat
            it for several.
          in: query
          name: not_priority
          schema:
            items:
              type: integer
            type: array
        - description: 'Text is a title or body predicate: title, body or any, then
            : for the whole field or ~ for a substring, then the value, as in title~api.
            A leading - negates it. Case is ignored; repeat it, and every term must
            hold.'
          in: query
          name: text
          schema:
            items:
              type: string
            type: array
        - description: DueBefore keeps tasks due before an RFC 3339 instant, such
            as 2026-05-01T00:00:00Z.
          in: query
          name: due_before
          schema:
            format: date-time
            type: string
        - description: DueAfter keeps tasks due after an RFC 3339 instant, such as
            2026-05-01T00:00:00Z.
          in: query
          name: due_after
          schema:
            format: date-time
            type: string
        - description: CustomFields is a JSON object of custom field values a task
            must hold, such as {"severity":"high","points":3}. Each value is a string,
            number or boolean. A parameter field.KEY matches one field and wins over
            this.
          in: query
          name: custom_fields
          schema:
            type: string
        - description: Format is csv to answer the page as CSV instead of JSON.
          in: query
          name: format
          schema:
            enum:
              - csv
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Task'
                    type:
                      - array
                      - "null"
                  next_cursor:
                    type: string
                type: object
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Task'
              x-tix-stream: one item per line, no envelope and no cursor
            text/csv:
              schema:
                type: string
          description: OK
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
