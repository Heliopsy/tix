  /api/v1/stats:
    get:
      description: |-
        Stats reports task throughput, lead times, ageing and a completion leaderboard over a window ending now, for the tenant or one project. The window defaults to 14 days; an unknown project is not_found and an out-of-range window or count is invalid.

        Command line: `tix stats`.

        Specified in [`http-api`](openspec/specs/http-api/spec.md).
      operationId: stats.read
      parameters:
        - description: Project is the key or ID of one project to report on; absent
            covers the whole tenant.
          in: query
          name: project
          schema:
            type: string
        - description: Since is the RFC 3339 instant the window starts at. It overrides
            window.
          in: query
          name: since
          schema:
            format: date-time
            type: string
        - description: 'Window is how far back the report reaches, a duration such
            as 7d or 168h: default 14 days, at most 3650.'
          in: query
          name: window
          schema:
            type: string
        - description: 'Top is how many actors the report ranks: default 5, at most
            100.'
          in: query
          name: top
          schema:
            type: integer
        - description: 'Oldest is how many of the oldest open tasks the report lists:
            default 5, at most 100.'
          in: query
          name: oldest
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: Stats is one tenant's throughput, ageing and leaderboard over
            a window. Every count is zero and every list empty when nothing happened,
            which is a successful answer rather than an error.
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "504":
          $ref: '#/components/responses/Error504'
      security:
        - bearer:
            - task:read
        - session:
            - task:read
      summary: Stats reports task throughput, lead times, ageing and a completion
        leaderboard over a window ending now, for the tenant or one project
      tags:
        - stats
