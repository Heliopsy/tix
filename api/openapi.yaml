        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "504":
          $ref: '#/components/responses/Error504'
      security:
        - bearer:
            - task:read
        - session:
            - task:read
      summary: ListTasks lists tasks matching the filter, one keyset-paginated page
