  /api/v1/ssh-keys:
    get:
      description: |-
        ListSSHKeys returns an actor's enrolled keys, revoked ones included: a key that stopped working is the thing an operator most wants to see.

        Command line: `tix user key ls`.
      operationId: sshkey.list
      parameters:
        - in: query
          name: actor_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/SSHKey'
                    type:
                      - array
                      - "null"
                  next_cursor:
                    type: string
                type: object
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/SSHKey'
              x-tix-stream: one item per line, no envelope and no cursor
          description: OK
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "504":
          $ref: '#/components/responses/Error504'
      security:
        - bearer:
            - token:admin
        - session:
            - token:admin
      summary: 'ListSSHKeys returns an actor''s enrolled keys, revoked ones included:
        a key that stopped working is the thing an operator most wants to see'
      tags:
        - sshkey
    post:
      description: |-
        EnrolSSHKey registers a public key against an actor of this tenant, so that key can reach the terminal interface over SSH.

        Command line: `tix user key add`.
      operationId: sshkey.enrol
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolSSHKeyInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHKey'
          description: 'SSHKey is a public key enrolled against an actor, letting
            that actor reach the terminal interface over SSH without a password. The
            key is a credential, so it is tenant-scoped like every other credential
            here: the same public key enrolled in two tenants is two rows, and revoking
            one leaves the other standing. Fingerprint is the SHA-256 form an ssh
            client prints, so what an operator compares by eye is what is stored.'
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "502":
          $ref: '#/components/responses/Error502'
        "504":
          $ref: '#/components/responses/Error504'
      security:
        - bearer:
            - token:admin
        - session:
            - token:admin
      summary: EnrolSSHKey registers a public key against an actor of this tenant,
        so that key can reach the terminal interface over SSH
      tags:
        - sshkey
