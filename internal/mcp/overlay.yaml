#
# Decisions the OpenAPI document cannot make about `tix mcp` tools. Every
# operation of api/openapi.yaml becomes a tool unless it is listed here as
# hidden or answers something other than JSON. Format: docs/mcp.md.
operations:
  # Signing in and second-factor enrolment belong to a person at a browser or a
  # terminal. The MCP server already runs with a credential.
  session.login:
    hide: true
    reason: signing in is how a credential is obtained, and the server already holds one
  session.logout:
    hide: true
    reason: ends a browser session, which a bearer token does not have
  session.ssh_challenge:
    hide: true
    reason: one step of an SSH key sign-in, which a bearer token never needs
  session.ssh_login:
    hide: true
    reason: one step of an SSH key sign-in, which a bearer token never needs
  totp.enrol:
    hide: true
    reason: a second factor is enrolled by its owner, on a device a model does not hold
  totp.confirm:
    hide: true
    reason: a second factor is enrolled by its owner, on a device a model does not hold
  totp.codes:
    hide: true
    reason: recovery codes are shown once to a person and are not for a model to read
  totp.verify:
    hide: true
    reason: a code comes from a person's device
  totp.status:
    hide: true
    reason: the caller's own second factor, which only the enrolment flow needs
  totp.remove:
    hide: true
    reason: a person removes their own second factor, never an agent on their behalf
  invite.preview:
    hide: true
    reason: an invite link is opened by the person it was sent to, in a browser, before they hold any credential
  invite.accept:
    hide: true
    reason: accepting an invite chooses a person's password and signs them in, which is theirs to do

  # Plumbing rather than work.
  api.spec:
    hide: true
    reason: the document these tools are generated from; the client already has it as tools
  server.health:
    hide: true
    reason: a liveness probe for a load balancer
  server.ready:
    hide: true
    reason: a readiness probe for a load balancer

  # Polling the event log is useful to a model catching up on what happened
  # since a cursor, but holding a tool call open for up to 25 seconds is not, so
  # the wait parameter is left out and the poll always answers at once.
  event.poll:
    hide_params: [wait]

  task.list:
    hide_params: [format]
    description: |-
      List tasks, keyset paginated: pass next_cursor back as cursor for the next page.
      Filters combine with AND; a list filter matches any of its values, and the not_ ones exclude.

  # A DELETE that only undoes a reversible mark is not destructive.
  task.unstar:
    destructive: false
    reason: unstarring is undone by starring
  task.unsnooze:
    destructive: false
    reason: waking a task early is undone by snoozing it again
  inbox.unread:
    destructive: false
    reason: marking an item unread is undone by reading it
  dependency.remove:
    destructive: false
    reason: removing an edge is undone by adding it back
  tag.remove:
    destructive: false
    reason: removing a tag is undone by adding it back
  view.reset:
    destructive: false
    reason: resets a personal column arrangement to its default and loses no task data

  # A POST that only reads: the export's choices travel as a body.
  task.export:
    read_only: true
    reason: writes a project's tasks out as a file and changes nothing
    description: |-
      Write one project's tasks as CSV (the default), JSON, NDJSON or a Markdown table. Pass format json for
      records a model can read, columns to choose and order the fields, and query for the task list's filter.
      To read one task, task_show is quicker.

  task.import:
    destructive: true
    reason: one call can create or overwrite hundreds of tasks
    description: |-
      Read a file of tasks into a project: CSV, JSON or NDJSON in content, or format lines for one task per line
      in quick-add syntax. To add a handful of tasks, call task_create once per task instead. Run with dry_run first:
      the answer lists the column mapping tix suggests, the first rows as they would be written and every row in
      error, and nothing is written while any row is in error. Pass mapping, a YAML mapping file, only for files from
      other tools whose columns the suggestion gets wrong.

  # Not a DELETE, but loses work or data all the same.
  task.bulk:
    destructive: true
    reason: one call can delete many tasks
  claim.reclaim:
    destructive: true
    reason: takes a live lease from the worker holding it, whose work is then refused
  retention.prune:
    destructive: true
    reason: deletes history past its retention window, which cannot be brought back
  housekeeping.run:
    destructive: true
    reason: moves finished tasks to the trash and empties the trash for good

  # Global admin: not deletes, but each one hands out or reshapes authority
  # over every tenant, so a model is offered them only when asked to be.
  tenant.create:
    destructive: true
    reason: creates a tenant and admin accounts whose passwords come back in the answer
  global_admin.grant:
    destructive: true
    reason: hands authority over every tenant to another user
  tenant.user.create:
    destructive: true
    reason: creates an account in another tenant, with any role there
  tenant.user.update:
    destructive: true
    reason: changes the role, password or access of an account in another tenant
