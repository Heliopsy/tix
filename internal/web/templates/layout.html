<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} &middot; {{.Brand.Title}}</title>
<link rel="stylesheet" href="/assets/app.css">
<style>:root { --accent: {{.Brand.Accent}}; --accent-soft: {{.Brand.AccentSoft}}; }</style>
<script src="/assets/htmx.min.js" defer></script>
<script src="/assets/live.js" defer></script>
</head>
<body hx-boost="true">
<header class="top">
  <div class="bar">
    <a class="brand" href="/"><span class="logo">{{.Brand.Monogram}}</span>{{.Brand.Title}}</a>
    <span class="meta">{{if .Actor}}{{.Actor.Handle}}{{end}}</span>
    {{if .Actor}}
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button class="secondary" type="submit">Sign out</button>
    </form>
    {{end}}
  </div>
</header>
{{if .Actor}}{{template "nav" .}}{{end}}
<main class="wrap">
  {{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
  {{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
  {{block "content" .}}{{end}}
</main>
</body>
</html>
