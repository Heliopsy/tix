{{define "content"}}
<h1>Activity</h1>
<p class="lede">Recent changes for this tenant, newest first.{{if eq .Data.Cursor ""}} With JavaScript the list updates as events arrive.{{end}}</p>
<div class="card">
  <ul class="plain feed" id="live-feed"{{if eq .Data.Cursor ""}} data-events="{{.EventsPath}}" data-feed="/activity/feed"{{end}}>
    {{template "activity-rows" .}}
  </ul>
</div>
{{if .Data.NextCursor}}<p><a href="/activity?cursor={{.Data.NextCursor}}">Older</a></p>{{end}}
{{end}}
