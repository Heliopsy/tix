<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later

     One sprite, referenced with <use href="/assets/icons.svg#name">.

     Why a sprite rather than inline SVG in the templates: the navigation
     renders on every screen, so inlining fourteen icons would put a kilobyte
     of path data in every response for something the browser can cache once.
     Why not an icon font: a font needs a glyph map nobody can read, fails to
     a box when it does not load, and cannot inherit stroke width.

     Every icon is drawn on a 24 unit grid with a 2 unit stroke, no fill, and
     round caps, so they sit on the same optical weight as 13px text at 16px.
     currentColor throughout, so an icon is whatever colour its label is. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="i-base" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6l2 2 3-3"/><path d="M11 6h10"/>
    <path d="M3 13l2 2 3-3"/><path d="M11 13h10"/>
    <path d="M3 20l2 2 3-3"/><path d="M11 20h10"/>
  </symbol>

  <symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
    <path d="M10 11v6"/><path d="M14 11v6"/>
  </symbol>

  <symbol id="projects" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7a2 2 0 0 1 2-2h3.5l2 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </symbol>

  <symbol id="activity" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h4l3 8 4-16 3 8h4"/>
  </symbol>

  <symbol id="stats" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/>
  </symbol>

  <symbol id="workflows" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="7" height="6" rx="1.5"/>
    <rect x="14" y="14" width="7" height="6" rx="1.5"/>
    <path d="M10 7h4a3 3 0 0 1 3 3v4"/>
  </symbol>

  <symbol id="tenant" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V7l7-3 7 3v13"/><path d="M9 20v-5h4v5"/>
  </symbol>

  <symbol id="domains" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><path d="M4 12h16"/>
    <path d="M12 4c2.5 2.6 2.5 13.4 0 16-2.5-2.6-2.5-13.4 0-16z"/>
  </symbol>

  <symbol id="users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.2"/>
    <path d="M3 20a6 6 0 0 1 12 0"/>
    <path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M18 20a6 6 0 0 0-3-5.2"/>
  </symbol>

  <symbol id="tokens" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17 12v4"/>
  </symbol>

  <symbol id="keys" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16v12H4z"/><path d="M7 11h3"/><path d="M7 15h7"/>
  </symbol>

  <symbol id="status" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>
  </symbol>

  <symbol id="connections" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/>
    <path d="M8.5 6H14a4 4 0 0 1 4 4v5.5"/>
  </symbol>

  <symbol id="webhooks" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 7a3.5 3.5 0 1 1 5 3l-2 3.5"/>
    <path d="M7.5 12.5 5 17a3.5 3.5 0 1 0 4 4.5"/>
    <path d="M12 20h5.5a3.5 3.5 0 0 0 .5-7"/>
  </symbol>

  <symbol id="transfer" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 10V3"/><path d="M4 6l3-3 3 3"/>
    <path d="M17 14v7"/><path d="M20 18l-3 3-3-3"/>
  </symbol>

  <symbol id="sync" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 0 1-13.7 5.7"/><path d="M4 12A8 8 0 0 1 17.7 6.3"/>
    <path d="M17.5 3v3.5H14"/><path d="M6.5 21v-3.5H10"/>
  </symbol>

  <symbol id="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>
  </symbol>

  <symbol id="sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
  </symbol>

  <symbol id="signout" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/>
  </symbol>

  <symbol id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M4 12h16M4 17h16"/>
  </symbol>

  <symbol id="columns" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M4 12h16M4 17h16"/>
    <circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/>
  </symbol>

  <!-- Add with details: a form's worth of lines, the fuller version of the
       one-line box beside it. -->
  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
  </symbol>
  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="details" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>
  </symbol>

  <!-- The star leaves fill unset, unlike every other icon, so the button that
       uses it can fill it when pressed and leave it an outline otherwise. -->
  <symbol id="info" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 11v6"/><path d="M12 7h.01"/>
  </symbol>

  <symbol id="star" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/>
  </symbol>

  <!-- Open the task, beside a title that renames in place. -->
  <symbol id="open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
  </symbol>

  <symbol id="more" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5h.01"/><path d="M12 12h.01"/><path d="M12 19h.01"/>
  </symbol>

  <!-- Project icons. A project may carry one of these instead of an emoji
       (internal/core/projecticon.go names the set). Prefixed pi- so a
       project symbol can never shadow a navigation one of the same name. -->

  <symbol id="pi-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7a2 2 0 0 1 2-2h3.5l2 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/>
  </symbol>

  <symbol id="pi-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>
  </symbol>

  <symbol id="pi-home" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>
  </symbol>

  <symbol id="pi-server" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01"/><path d="M7 16.5h.01"/>
  </symbol>

  <symbol id="pi-database" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </symbol>

  <symbol id="pi-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 17.7 9.6 4.7 4.7 0 0 1 17 19z"/>
  </symbol>

  <symbol id="pi-code" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 4l-4 16"/>
  </symbol>

  <symbol id="pi-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/>
  </symbol>

  <symbol id="pi-bug" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 10a4 4 0 0 1 8 0v4a4 4 0 0 1-8 0z"/><path d="M12 10v8"/><path d="M4 11h4"/><path d="M16 11h4"/><path d="M4 16h4"/><path d="M16 16h4"/><path d="M9 3.5l1.5 2.5"/><path d="M15 3.5L13.5 6"/>
  </symbol>

  <symbol id="pi-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5c3 2 4.5 5.5 4.5 9.5L14.5 17h-5L7.5 12c0-4 1.5-7.5 4.5-9.5z"/><circle cx="12" cy="9.5" r="1.5"/><path d="M7.7 13.5L5 16.5l3.5.5"/><path d="M16.3 13.5l2.7 3-3.5.5"/><path d="M10.5 20.5h3"/>
  </symbol>

  <symbol id="pi-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>
  </symbol>

  <symbol id="pi-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2"/>
  </symbol>

  <symbol id="pi-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 2.9 2.8 15.1 0 18-2.8-2.9-2.8-15.1 0-18z"/>
  </symbol>

  <symbol id="pi-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4v16h16"/><path d="M7 15l4-4 3 3 5-6"/>
  </symbol>

  <symbol id="pi-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h14"/><path d="M8 7h8"/>
  </symbol>

  <symbol id="pi-users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.8a3 3 0 0 1 0 6"/><path d="M17.5 14.5A5.5 5.5 0 0 1 21 20"/>
  </symbol>

  <symbol id="pi-package" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/><path d="M8 5.25l8 4.5"/>
  </symbol>

  <symbol id="pi-wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 4a5 5 0 0 0-4.6 6.9L4 17.3a1.9 1.9 0 0 0 2.7 2.7l6.4-6.4A5 5 0 0 0 20 9l-3 1-2-2z"/>
  </symbol>

  <symbol id="pi-flask" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/>
  </symbol>

  <symbol id="pi-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
  </symbol>
</svg>
